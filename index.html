<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Kumiko 3D (Jigumi Real)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/3MFExporter.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // 1. Cama de Impresión
            const [bedWidth, setBedWidth] = useState(250);
            const [bedHeight, setBedHeight] = useState(250);

            // 2. Medidas del Cuadro (Defaults)
            const [width, setWidth] = useState(388); 
            const [height, setHeight] = useState(488); 
            
            // 3. Guías de Corte (Camas)
            const [panelCols, setPanelCols] = useState(2);
            const [panelRows, setPanelRows] = useState(2);
            const [showGuides, setShowGuides] = useState(true);
            const [exportSelection, setExportSelection] = useState('single'); // VARIABLE RESTAURADA
            
            // 4. Estados del patrón Jigumi Real
            const [triangleSide, setTriangleSide] = useState(43.5); 
            const [patternCols, setPatternCols] = useState(10);      
            const [patternRows, setPatternRows] = useState(14);     
            const [thickness, setThickness] = useState(3);          
            const [depth, setDepth] = useState(5);
            const [showBorders, setShowBorders] = useState(true);
            const [isAutoFit, setIsAutoFit] = useState(false); 

            // Modales
            const [showConfigModal, setShowConfigModal] = useState(false);
            const [showInfoModal, setShowInfoModal] = useState(false);
            const [configText, setConfigText] = useState("");

            const mountRef = useRef(null);
            const sceneRef = useRef(null);
            const cameraRef = useRef(null);
            const rendererRef = useRef(null);
            const meshGroupRef = useRef(null);
            const guidesGroupRef = useRef(null);
            const singleMeshRef = useRef(null); 
            const panelsRef = useRef([]);

            // Valores numéricos seguros
            const validWidth = Number(width) || 0;
            const validHeight = Number(height) || 0;
            const validTriangleSide = Number(triangleSide) || 43.5;
            const validPatternCols = Number(patternCols) || 1;
            const validPatternRows = Number(patternRows) || 1;

            const hasValidDimensions = validWidth > 0 && validHeight > 0;

            const pw = validWidth > 0 ? validWidth / panelCols : 0;
            const ph = validHeight > 0 ? validHeight / panelRows : 0;

            const SQRT3 = Math.sqrt(3);
            
            // Si el marco está encendido, descontamos el grosor en TODOS los bordes.
            const targetInnerW = showBorders ? Math.max(0, validWidth - thickness * 2) : validWidth;
            const targetInnerH = showBorders ? Math.max(0, validHeight - thickness * 2) : validHeight;

            const cellW = isAutoFit ? (validPatternCols > 0 ? targetInnerW / validPatternCols : 0) : validTriangleSide;
            const cellH = isAutoFit ? (validPatternRows > 0 ? targetInnerH / validPatternRows : 0) : (validTriangleSide * SQRT3 / 2);

            const innerW = validPatternCols * cellW;
            const innerH = validPatternRows * cellH;
            
            const currentRatio = cellH > 0 ? (cellW / cellH) : 1.1547;
            const baseAngle = Math.atan2(cellH, cellW / 2) * (180 / Math.PI); 

            // Inicializar Three.js
            useEffect(() => {
                const containerWidth = mountRef.current.clientWidth;
                const containerHeight = mountRef.current.clientHeight;

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0xf0f0f0);
                sceneRef.current = scene;

                const camera = new THREE.PerspectiveCamera(45, containerWidth / containerHeight, 0.1, 2000);
                camera.position.set(0, 0, 600);
                cameraRef.current = camera;

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(containerWidth, containerHeight);
                renderer.shadowMap.enabled = true;
                mountRef.current.appendChild(renderer.domElement);
                rendererRef.current = renderer;

                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
                dirLight.position.set(100, 100, 200);
                scene.add(dirLight);

                const meshGroup = new THREE.Group();
                scene.add(meshGroup);
                meshGroupRef.current = meshGroup;

                const guidesGroup = new THREE.Group();
                scene.add(guidesGroup);
                guidesGroupRef.current = guidesGroup;

                const animate = () => {
                    requestAnimationFrame(animate);
                    controls.update();
                    renderer.render(scene, camera);
                };
                animate();

                const handleResize = () => {
                    if (mountRef.current && rendererRef.current && cameraRef.current) {
                        const newWidth = mountRef.current.clientWidth;
                        const newHeight = mountRef.current.clientHeight;
                        rendererRef.current.setSize(newWidth, newHeight);
                        cameraRef.current.aspect = newWidth / newHeight;
                        cameraRef.current.updateProjectionMatrix();
                    }
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    mountRef.current.removeChild(renderer.domElement);
                };
            }, []);

            // Generar geometría del KUMIKO
            useEffect(() => {
                if (!meshGroupRef.current) return;
                const group = meshGroupRef.current;
                
                while(group.children.length > 0){ 
                    const child = group.children[0];
                    group.remove(child); 
                    if(child.geometry) child.geometry.dispose();
                    if(child.material) child.material.dispose();
                }
                
                singleMeshRef.current = null;
                panelsRef.current = [];

                if (!hasValidDimensions) return;

                // Límites Globales del cuadro 3D
                const GLx = validWidth / 2;
                const GLy = validHeight / 2;
                const borderT = showBorders ? thickness : 0;

                // El patrón central se genera en base a su tamaño matemático
                const PXmin = -innerW / 2;
                const PXmax = innerW / 2;
                const PYmin = -innerH / 2;
                const PYmax = innerH / 2;

                // Definimos la caja donde el patrón es VISIBLE. 
                const renderMinX = Math.max(-GLx + borderT, PXmin);
                const renderMaxX = Math.min(GLx - borderT, PXmax);
                const renderMinY = Math.max(-GLy + borderT, PYmin);
                const renderMaxY = Math.min(GLy - borderT, PYmax);
                const renderBox = { minX: renderMinX, maxX: renderMaxX, minY: renderMinY, maxY: renderMaxY };

                function clipSegmentToBox(pA, pB, box) {
                    let x0 = pA.x, y0 = pA.y;
                    let x1 = pB.x, y1 = pB.y;
                    let dx = x1 - x0, dy = y1 - y0;
                    let p = [-dx, dx, -dy, dy];
                    let q = [x0 - box.minX, box.maxX - x0, y0 - box.minY, box.maxY - y0];
                    let t0 = 0.0, t1 = 1.0;

                    for (let i = 0; i < 4; i++) {
                        if (p[i] === 0) {
                            if (q[i] < 0) return null;
                        } else {
                            let t = q[i] / p[i];
                            if (p[i] < 0) {
                                if (t > t1) return null;
                                if (t > t0) t0 = t;
                            } else {
                                if (t < t0) return null;
                                if (t < t1) t1 = t;
                            }
                        }
                    }
                    if (t0 > t1) return null;
                    return { A: new THREE.Vector2(x0 + t0 * dx, y0 + t0 * dy), B: new THREE.Vector2(x0 + t1 * dx, y0 + t1 * dy) };
                }

                // Trazar todas las líneas maestras del Jigumi
                const rawSegments = [];
                let startJ = showBorders ? 0 : 1;
                let endJ = showBorders ? validPatternRows : validPatternRows - 1;
                for (let j = startJ; j <= endJ; j++) {
                    rawSegments.push({ A: new THREE.Vector2(PXmin, PYmin + j * cellH), B: new THREE.Vector2(PXmax, PYmin + j * cellH) });
                }

                for (let k = -validPatternRows - 2; k <= validPatternCols + 2; k++) {
                    rawSegments.push({ A: new THREE.Vector2(PXmin + k * cellW, PYmin), B: new THREE.Vector2(PXmin + k * cellW + validPatternRows * (cellW / 2), PYmax) });
                }

                for (let k = -2; k <= validPatternCols + validPatternRows + 2; k++) {
                    rawSegments.push({ A: new THREE.Vector2(PXmin + k * cellW, PYmin), B: new THREE.Vector2(PXmin + k * cellW - validPatternRows * (cellW / 2), PYmax) });
                }

                const createGeosForBox = (box, offX, offY, isPanel = true) => {
                    const geos = [];
                    const eps = 0.01;

                    let clipBox = {
                        minX: Math.max(box.minX, renderMinX),
                        maxX: Math.min(box.maxX, renderMaxX),
                        minY: Math.max(box.minY, renderMinY),
                        maxY: Math.min(box.maxY, renderMaxY)
                    };

                    if (clipBox.maxX > clipBox.minX && clipBox.maxY > clipBox.minY) {
                        rawSegments.forEach(seg => {
                            let clp = clipSegmentToBox(seg.A, seg.B, clipBox);
                            if (!clp) return;

                            let dx = clp.B.x - clp.A.x, dy = clp.B.y - clp.A.y;
                            let len = Math.sqrt(dx*dx + dy*dy);
                            if (len < 0.001) return;

                            let dir = new THREE.Vector2(dx/len, dy/len);

                            const getAdjust = (P) => {
                                let hitsX = (Math.abs(Math.abs(P.x) - GLx) < eps);
                                let hitsY = (Math.abs(Math.abs(P.y) - GLy) < eps);
                                
                                if (hitsX || hitsY) {
                                    let delta = 0;
                                    if (Math.abs(dx) > 0.001 && Math.abs(dy) > 0.001) {
                                        if (hitsX && hitsY) delta = (thickness/2) * Math.max(Math.abs(dy/dx), Math.abs(dx/dy));
                                        else if (hitsX) delta = (thickness/2) * Math.abs(dy/dx);
                                        else if (hitsY) delta = (thickness/2) * Math.abs(dx/dy);
                                    }
                                    return -Math.min(delta, thickness * 2);
                                } else {
                                    let touchesPanelBoundary = (
                                        Math.abs(P.x - box.minX) < eps || Math.abs(P.x - box.maxX) < eps ||
                                        Math.abs(P.y - box.minY) < eps || Math.abs(P.y - box.maxY) < eps
                                    );
                                    if (isPanel && touchesPanelBoundary) {
                                        return 0; 
                                    }
                                    return thickness * 0.65; 
                                }
                            };

                            let adjA = getAdjust(clp.A);
                            let adjB = getAdjust(clp.B);

                            let newA = clp.A.clone().addScaledVector(dir, -adjA);
                            let newB = clp.B.clone().addScaledVector(dir, adjB);

                            let finalDx = newB.x - newA.x, finalDy = newB.y - newA.y;
                            let finalLen = Math.sqrt(finalDx*finalDx + finalDy*finalDy);
                            if (finalLen < 0.01) return;

                            let ang = Math.atan2(finalDy, finalDx);
                            let midX = (newA.x + newB.x) / 2;
                            let midY = (newA.y + newB.y) / 2;

                            let curT = thickness;
                            if (isPanel && Math.abs(finalDy) < 0.01) {
                                if (Math.abs(clp.A.y - box.maxY) < eps) { curT = thickness / 2; midY -= thickness / 4; }
                                else if (Math.abs(clp.A.y - box.minY) < eps) { curT = thickness / 2; midY += thickness / 4; }
                            }

                            const geo = new THREE.BoxGeometry(finalLen, curT, depth);
                            const m4 = new THREE.Matrix4();
                            m4.makeRotationZ(ang);
                            m4.setPosition(midX - offX, midY - offY, 0);
                            geo.applyMatrix4(m4);
                            geos.push(geo);
                        });
                    }

                    if (showBorders) {
                        const addR = (rMinX, rMaxX, rMinY, rMaxY) => {
                            let x1 = Math.max(rMinX, box.minX), x2 = Math.min(rMaxX, box.maxX);
                            let y1 = Math.max(rMinY, box.minY), y2 = Math.min(rMaxY, box.maxY);
                            if (x2 > x1 && y2 > y1) {
                                const geo = new THREE.BoxGeometry(x2 - x1 + 0.02, y2 - y1 + 0.02, depth);
                                const m4 = new THREE.Matrix4();
                                m4.setPosition((x1 + x2)/2 - offX, (y1 + y2)/2 - offY, 0);
                                geo.applyMatrix4(m4);
                                geos.push(geo);
                            }
                        };
                        addR(-GLx, renderMinX, -GLy, GLy); 
                        addR(renderMaxX, GLx, -GLy, GLy);  
                        addR(renderMinX, renderMaxX, -GLy, renderMinY); 
                        addR(renderMinX, renderMaxX, renderMaxY, GLy);  
                    }
                    return geos;
                };

                // Crear los Paneles Separados (Si el usuario los pide en ZIP)
                for (let py = 0; py < panelRows; py++) {
                    for (let px = 0; px < panelCols; px++) {
                        let cx = -validWidth/2 + pw/2 + px * pw, cy = -validHeight/2 + ph/2 + py * ph;
                        const panelBox = { minX: cx - pw/2, maxX: cx + pw/2, minY: cy - ph/2, maxY: cy + ph/2 };
                        const geos = createGeosForBox(panelBox, cx, cy, true);
                        if (geos.length > 0) {
                            const m = new THREE.Mesh(THREE.BufferGeometryUtils.mergeBufferGeometries(geos), new THREE.MeshLambertMaterial({ color: (px+py)%2===0?0xddb870:0xcb9f55 }));
                            m.position.set((px - (panelCols-1)/2)*pw, (py - (panelRows-1)/2)*ph, 0);
                            m.userData = { px, py, name: `Panel ${px+1}x${py+1}` };
                            panelsRef.current.push(m);
                        }
                    }
                }

                // Crear Objeto Visual Completo
                const fullGeos = createGeosForBox({minX:-validWidth/2, maxX:validWidth/2, minY:-validHeight/2, maxY:validHeight/2}, 0, 0, false);
                if (fullGeos.length > 0) {
                    const mergedGeometry = THREE.BufferGeometryUtils.mergeBufferGeometries(fullGeos);
                    singleMeshRef.current = new THREE.Mesh(mergedGeometry, new THREE.MeshLambertMaterial({color: 0xcb9f55}));
                    group.add(singleMeshRef.current);
                }

            }, [validWidth, validHeight, validTriangleSide, validPatternCols, validPatternRows, thickness, depth, panelCols, panelRows, pw, ph, showBorders, innerW, innerH, cellW, cellH, isAutoFit]);

            // Generar Guías de Corte (Líneas Rojas)
            useEffect(() => {
                if (!guidesGroupRef.current) return;
                const group = guidesGroupRef.current;
                
                while(group.children.length > 0){ 
                    const child = group.children[0];
                    group.remove(child); 
                    if(child.geometry) child.geometry.dispose();
                    if(child.material) child.material.dispose();
                }

                if (!hasValidDimensions || !showGuides || (panelCols === 1 && panelRows === 1)) return;

                const guideMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0xff0000, transparent: true, opacity: 0.6, side: THREE.DoubleSide
                });

                for (let i = 1; i < panelCols; i++) {
                    const cutX = -validWidth/2 + i * pw;
                    const geo = new THREE.BoxGeometry(1.5, validHeight + 20, depth + 10);
                    const mesh = new THREE.Mesh(geo, guideMaterial);
                    mesh.position.set(cutX, 0, 0);
                    group.add(mesh);
                }
                for (let j = 1; j < panelRows; j++) {
                    const cutY = -validHeight/2 + j * ph;
                    const geo = new THREE.BoxGeometry(validWidth + 20, 1.5, depth + 10);
                    const mesh = new THREE.Mesh(geo, guideMaterial);
                    mesh.position.set(0, cutY, 0);
                    group.add(mesh);
                }

            }, [validWidth, validHeight, panelCols, panelRows, pw, ph, showGuides, depth, hasValidDimensions]);


            const autoCalculatePanels = () => {
                if (validWidth > 0 && validHeight > 0) {
                    setPanelCols(Math.ceil(validWidth / bedWidth));
                    setPanelRows(Math.ceil(validHeight / bedHeight));
                }
            };

            const autoAdjustPattern = () => {
                if (validWidth > 0 && validHeight > 0 && validTriangleSide > 0) {
                    let targetW = validWidth - thickness * 2;
                    let targetH = validHeight - thickness * 2;
                    if (targetW < 0) targetW = validWidth;
                    if (targetH < 0) targetH = validHeight;

                    setPatternCols(Math.floor(targetW / validTriangleSide));
                    setPatternRows(Math.floor(targetH / (validTriangleSide * Math.sqrt(3)/2)));
                }
            };

            const fitPitchToWidth = () => {
                if (validWidth > 0 && validPatternCols > 0) {
                    let newPitch = (validWidth - thickness * 2) / validPatternCols;
                    setTriangleSide(parseFloat(newPitch.toFixed(2)));
                }
            };

            const fitPitchToHeight = () => {
                if (validHeight > 0 && validPatternRows > 0) {
                    let newPitch = (validHeight - thickness * 2) / (validPatternRows * Math.sqrt(3)/2);
                    setTriangleSide(parseFloat(newPitch.toFixed(2)));
                }
            };

            const handleApplyConfig = () => {
                try {
                    const parsed = JSON.parse(configText);
                    if(parsed.bedWidth) setBedWidth(parsed.bedWidth);
                    if(parsed.bedHeight) setBedHeight(parsed.bedHeight);
                    if(parsed.width) setWidth(parsed.width);
                    if(parsed.height) setHeight(parsed.height);
                    if(parsed.panelCols) setPanelCols(parsed.panelCols);
                    if(parsed.panelRows) setPanelRows(parsed.panelRows);
                    if(parsed.triangleSide) setTriangleSide(parsed.triangleSide);
                    if(parsed.patternCols) setPatternCols(parsed.patternCols);
                    if(parsed.patternRows) setPatternRows(parsed.patternRows);
                    if(parsed.thickness) setThickness(parsed.thickness);
                    if(parsed.depth) setDepth(parsed.depth);
                    if(parsed.showBorders !== undefined) setShowBorders(parsed.showBorders);
                    if(parsed.isAutoFit !== undefined) setIsAutoFit(parsed.isAutoFit);
                    setShowConfigModal(false);
                    alert("¡Configuración aplicada correctamente!");
                } catch (e) {
                    alert("Error: El texto proporcionado no es un código de configuración válido.");
                }
            };

            const copyToClipboard = () => {
                try {
                    const el = document.createElement('textarea');
                    el.value = configText;
                    el.setAttribute('readonly', '');
                    el.style.position = 'absolute';
                    el.style.left = '-9999px';
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    alert("¡Código copiado al portapapeles!");
                } catch (e) {
                    alert("No se pudo copiar automáticamente. Por favor, selecciona el texto y cópialo manualmente.");
                }
            };

            const exportFile = (format) => {
                if (!hasValidDimensions) {
                    alert("Por favor ingresa las medidas del cuadro primero.");
                    return;
                }
                
                try {
                    const exportScene = new THREE.Scene();
                    let filename = "";

                    if (exportSelection === 'all') {
                        if (format !== 'stl') {
                            alert("La exportación en paneles separados solo está disponible en formato STL (Se descargará un ZIP).");
                            return;
                        }
                        if (panelsRef.current.length === 0) {
                            alert("Error: No hay paneles generados para exportar.");
                            return;
                        }
                        
                        const zip = {}; 
                        const stlExp = new THREE.STLExporter();
                        panelsRef.current.forEach(p => {
                            const sc = new THREE.Scene(); 
                            const cl = p.clone(); 
                            cl.position.set(0,0,0); 
                            sc.add(cl);
                            zip[`kumiko_${p.userData.name.replace(/ /g,'_')}.stl`] = new TextEncoder().encode(stlExp.parse(sc));
                        });
                        const blob = new Blob([window.fflate.zipSync(zip)], { type: 'application/zip' });
                        const link = document.createElement('a'); 
                        link.href = URL.createObjectURL(blob); 
                        link.download = `Kumiko_Paneles_Separados_${validWidth}x${validHeight}.zip`; 
                        link.click();
                        return;

                    } else if (exportSelection === 'single') {
                        if (!singleMeshRef.current) return alert("Error: La malla no está lista.");
                        exportScene.add(singleMeshRef.current.clone());
                        filename = `Kumiko_ModeloEntero_${validWidth}x${validHeight}.${format}`;
                    } else {
                        const panel = panelsRef.current.find(x => x.userData.name === exportSelection); 
                        if(!panel) return alert("Panel no encontrado.");
                        const cl = panel.clone(); 
                        cl.position.set(0,0,0); 
                        exportScene.add(cl); 
                        filename = `Kumiko_${exportSelection.replace(/ /g, '_')}.${format}`;
                    }

                    let fileStringOrBuffer;
                    let mimeType;

                    if (format === '3mf') {
                        if (typeof THREE['3MFExporter'] === 'undefined') throw new Error("El exportador 3MF no cargó.");
                        const exporter = new THREE['3MFExporter']();
                        fileStringOrBuffer = exporter.parse(exportScene);
                        mimeType = 'application/vnd.ms-3mfdocument';
                    } else {
                        const exporter = new THREE.STLExporter();
                        fileStringOrBuffer = exporter.parse(exportScene);
                        mimeType = 'text/plain';
                    }
                    
                    const blob = new Blob([fileStringOrBuffer], { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.style.display = 'none';
                    link.href = url;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (error) {
                    console.error(error);
                    alert("Error en la exportación: " + error.message);
                }
            };

            const handleNumberInput = (setter) => (e) => {
                const val = e.target.value;
                setter(val === '' ? '' : Number(val));
            };

            return (
                <div className="flex h-full relative text-xs">
                    
                    {showConfigModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-lg shadow-2xl w-full max-w-md">
                                <h2 className="text-xl font-bold mb-2 text-gray-800">Cargar / Guardar Configuración</h2>
                                <p className="text-xs text-gray-500 mb-4">Copia este código para guardarlo, o pega un código anterior para recuperar todas las medidas y ajustes.</p>
                                <textarea
                                    className="w-full h-40 border border-gray-300 p-3 text-xs font-mono rounded bg-gray-50 mb-4 focus:ring-blue-500 focus:border-blue-500"
                                    value={configText}
                                    onChange={(e) => setConfigText(e.target.value)}
                                    placeholder="Pega aquí tu código de configuración..."
                                />
                                <div className="flex gap-2 mb-2">
                                    <button onClick={copyToClipboard} className="w-1/2 bg-gray-100 hover:bg-gray-200 text-gray-800 py-2 rounded text-sm font-semibold transition-colors border border-gray-300 shadow-sm">
                                        📋 Copiar Código
                                    </button>
                                    <button onClick={handleApplyConfig} className="w-1/2 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded text-sm font-semibold transition-colors shadow-sm">
                                        ⚙️ Aplicar Cambios
                                    </button>
                                </div>
                                <button onClick={() => setShowConfigModal(false)} className="w-full text-gray-500 hover:text-gray-800 hover:bg-gray-100 text-sm py-2 mt-2 rounded transition-colors font-medium">
                                    Cancelar
                                </button>
                            </div>
                        </div>
                    )}

                    {showInfoModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-lg shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4 border-b pb-2">
                                    <h2 className="text-xl font-bold text-gray-800">⛩️ La Matemática del Kumiko</h2>
                                    <button onClick={() => setShowInfoModal(false)} className="text-gray-500 hover:text-red-500 text-xl font-bold">×</button>
                                </div>
                                
                                <div className="space-y-4 text-sm text-gray-700">
                                    <p>El patrón base del Kumiko (el <strong>Jigumi</strong>) se fundamenta estrictamente en <strong>triángulos equiláteros perfectos</strong>. Todos sus ángulos internos deben medir exactamente 60°.</p>
                                    
                                    <h3 className="font-bold text-blue-700 mt-4">📐 La Proporción de Oro (El Ideal)</h3>
                                    <p>En un triángulo equilátero perfecto, la relación matemática entre el Ancho (base) y el Alto nunca es 1 a 1. La altura siempre es un 86.6% del ancho.</p>
                                    <div className="bg-blue-50 p-2 rounded text-center border border-blue-200 font-mono text-blue-800">
                                        Proporción Perfecta = Ancho ÷ Alto ≈ 1.15
                                    </div>

                                    <h3 className="font-bold text-gray-800 mt-4">⚠️ Las Tolerancias (¿Cuándo se rompe la ilusión?)</h3>
                                    <p>Si usas la función <b>"Auto-encajar perfecto"</b>, la aplicación deformará la cuadrícula para rellenar tu cuadro. Fíjate en la Relación mostrada en la app:</p>
                                    <ul className="space-y-2">
                                        <li className="flex items-start gap-2">
                                            <span className="text-xl leading-none">🟢</span>
                                            <div><strong>Invisible (1.10 a 1.20):</strong> Ángulos entre 58° y 62°. Indetectable a simple vista. ¡Excelente!</div>
                                        </li>
                                        <li className="flex items-start gap-2">
                                            <span className="text-xl leading-none">🟡</span>
                                            <div><strong>Aceptable (1.04 a 1.26):</strong> El ojo experto lo notará levemente, pero mantiene la estética general.</div>
                                        </li>
                                        <li className="flex items-start gap-2">
                                            <span className="text-xl leading-none">🔴</span>
                                            <div><strong>Ruptura (&lt; 1.04 o &gt; 1.26):</strong> Deja de verse como Kumiko. Los triángulos son muy puntiagudos o muy achatados. Las piezas de relleno (como Asa-no-ha) se verán ovaladas.</div>
                                        </li>
                                    </ul>
                                </div>
                                
                                <button onClick={() => setShowInfoModal(false)} className="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 text-sm py-2 mt-6 rounded transition-colors font-medium border border-gray-300">
                                    Entendido
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="w-80 bg-white shadow-xl z-10 flex flex-col overflow-y-auto">
                        <div className="p-4 border-b bg-gray-50 flex justify-between items-center">
                            <div>
                                <h1 className="text-lg font-bold text-gray-800 uppercase tracking-tighter">Kumiko Precision</h1>
                                <p className="text-[10px] font-semibold text-emerald-600 uppercase mt-0.5 tracking-wider">Corte Sólido (Bambu)</p>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setShowInfoModal(true)} className="text-gray-400 hover:text-blue-500 transition-colors" title="Teoría Kumiko">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                                </button>
                                <button 
                                    onClick={() => {
                                        const configObj = {
                                            bedWidth, bedHeight, width, height, panelCols, panelRows,
                                            triangleSide, patternCols, patternRows, thickness, depth,
                                            showBorders, isAutoFit
                                        };
                                        setConfigText(JSON.stringify(configObj, null, 2));
                                        setShowConfigModal(true);
                                    }}
                                    className="text-gray-400 hover:text-blue-600 transition-colors" title="Guardar/Cargar"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </div>
                        </div>
                        
                        <div className="p-4 space-y-4 flex-grow">
                            <section>
                                <h2 className="font-bold text-blue-600 uppercase mb-2">1. Medidas Cuadro</h2>
                                <div className="flex gap-2">
                                    <div className="w-1/2"><label className="text-gray-400">Ancho (X)</label><input type="number" value={width} onChange={handleNumberInput(setWidth)} className="w-full border p-1 rounded font-bold" /></div>
                                    <div className="w-1/2"><label className="text-gray-400">Alto (Y)</label><input type="number" value={height} onChange={handleNumberInput(setHeight)} className="w-full border p-1 rounded font-bold" /></div>
                                </div>
                            </section>
                            
                            <section>
                                <div className="flex justify-between items-center mb-2">
                                    <h2 className="font-bold text-blue-600 uppercase">2. Guías de Corte</h2>
                                    <label className="flex items-center gap-1 text-[10px] text-red-600 font-bold bg-red-50 px-1.5 py-0.5 rounded cursor-pointer">
                                        <input type="checkbox" checked={showGuides} onChange={e => setShowGuides(e.target.checked)} /> Ver Láser
                                    </label>
                                </div>
                                <div className="flex gap-2">
                                    <div className="w-1/2"><label className="text-gray-400">Camas X</label><input type="number" value={panelCols} onChange={e => setPanelCols(Math.max(1, Number(e.target.value)))} className="w-full border p-1 rounded" /></div>
                                    <div className="w-1/2"><label className="text-gray-400">Camas Y</label><input type="number" value={panelRows} onChange={e => setPanelRows(Math.max(1, Number(e.target.value)))} className="w-full border p-1 rounded" /></div>
                                </div>
                                <div className="mt-1 text-[10px] text-gray-500">Cada pieza a imprimir medirá: {pw.toFixed(1)} x {ph.toFixed(1)} mm</div>
                                
                                <div className="mt-2 text-[9px] bg-amber-50 text-amber-800 p-1.5 rounded border border-amber-200">
                                    <b>Nota Pro:</b> La app ya no divide el modelo físicamente para evitar uniones frágiles. Usa las guías rojas para ver dónde hacer el corte <b>perfecto</b> (Tecla C) directo en Bambu Studio.
                                </div>
                            </section>

                            <section className="bg-blue-50 p-2 rounded border border-blue-100">
                                <h2 className="font-bold text-blue-700 uppercase mb-2">3. Patrón Jigumi</h2>
                                <label className="flex items-center gap-2 mb-2"><input type="checkbox" checked={showBorders} onChange={e => setShowBorders(e.target.checked)} /> Marco Sólido</label>
                                <label className="flex items-center gap-2 mb-2 text-blue-800 font-bold"><input type="checkbox" checked={isAutoFit} onChange={e => setIsAutoFit(e.target.checked)} /> Auto-encajar al Marco</label>
                                
                                {!isAutoFit && (
                                    <div className="mb-2">
                                        <label className="text-gray-500 font-bold">Lado Triángulo (Pitch)</label>
                                        <input type="number" step="0.5" value={triangleSide} onChange={handleNumberInput(setTriangleSide)} className="w-full border p-1 rounded font-mono" />
                                    </div>
                                )}

                                <div className="flex gap-2 mb-2">
                                    <div className="w-1/2"><label className="text-[10px] text-gray-400">Cols (Size A)</label><input type="number" value={patternCols} onChange={handleNumberInput(setPatternCols)} className="w-full border p-1 rounded font-mono" /></div>
                                    <div className="w-1/2"><label className="text-[10px] text-gray-400">Filas (Size B)</label><input type="number" value={patternRows} onChange={handleNumberInput(setPatternRows)} className="w-full border p-1 rounded font-mono" /></div>
                                </div>
                                
                                <button onClick={autoAdjustPattern} className="mt-1 mb-2 w-full text-[10px] bg-white hover:bg-gray-100 border py-1 rounded font-bold transition-colors">⚖️ 1. Auto-Calcular Cantidades</button>
                                
                                {!isAutoFit && (
                                    <div className="flex gap-1 mb-2">
                                        <button onClick={fitPitchToWidth} className="w-1/2 text-[9px] bg-white border py-1 rounded hover:bg-blue-100">↔️ Ajustar Ancho</button>
                                        <button onClick={fitPitchToHeight} className="w-1/2 text-[9px] bg-white border py-1 rounded hover:bg-blue-100">↕️ Ajustar Alto</button>
                                    </div>
                                )}

                                <div className="space-y-1 p-2 bg-white border rounded text-[10px] shadow-inner font-mono">
                                    <div className="flex justify-between"><span>Relación:</span> <b>{currentRatio.toFixed(2)}</b></div>
                                    <div className="flex justify-between"><span>Ángulo:</span> <b>{baseAngle.toFixed(1)}°</b></div>
                                    <div className="flex justify-between text-indigo-600 font-bold border-t mt-1 pt-1"><span>Triángulos (Píxeles):</span> <b>{validPatternCols * validPatternRows * 2}</b></div>
                                </div>
                                
                                <div className="mt-2 flex gap-2">
                                    <div className="w-1/2"><label className="text-[10px] text-gray-400">Mitsuke (Grosor)</label><input type="number" step="0.5" value={thickness} onChange={handleNumberInput(setThickness)} className="w-full border p-1 rounded" /></div>
                                    <div className="w-1/2"><label className="text-[10px] text-gray-400">Z (Altura 3D)</label><input type="number" value={depth} onChange={handleNumberInput(setDepth)} className="w-full border p-1 rounded" /></div>
                                </div>
                            </section>
                        </div>

                        <div className="p-4 border-t bg-gray-50 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
                            <select value={exportSelection} onChange={e => setExportSelection(e.target.value)} className="w-full border p-2 rounded mb-2 font-bold bg-white text-blue-900 border-blue-200">
                                <option value="single">⭐️ Modelo Entero (Bambu Lab)</option>
                                <option value="all">Múltiples STL Independientes (ZIP)</option>
                                {panelsRef.current.map(p => <option key={p.userData.name} value={p.userData.name}>{p.userData.name}</option>)}
                            </select>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => exportFile('3mf')}
                                    disabled={!hasValidDimensions}
                                    className={`w-2/3 text-white font-bold py-2 rounded text-xs shadow-sm transition-all hover:-translate-y-0.5 ${!hasValidDimensions ? 'bg-gray-400' : 'bg-emerald-600 hover:bg-emerald-700'}`}
                                >
                                    Exportar .3MF
                                </button>
                                <button 
                                    onClick={() => exportFile('stl')}
                                    disabled={!hasValidDimensions}
                                    className={`w-1/3 text-white font-bold py-2 rounded text-xs shadow-sm transition-all hover:-translate-y-0.5 ${!hasValidDimensions ? 'bg-gray-400' : 'bg-blue-600 hover:bg-blue-700'}`}
                                >
                                    .STL
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="flex-grow relative bg-[#e5e7eb] cursor-move flex items-center justify-center" ref={mountRef}>
                        {!hasValidDimensions && <div className="text-gray-400 font-bold uppercase tracking-widest animate-pulse">Cargando visualización...</div>}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
