<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Kumiko Interactivo Pro V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/3MFExporter.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const WOOD_COLORS = [
            { id: 'negro', hex: '#1a1a1a', name: 'Negro' },
            { id: 'blanco', hex: '#ffffff', name: 'Blanco' },
            { id: 'claro', hex: '#eaddb6', name: 'Maple' },
            { id: 'medio', hex: '#cb9f55', name: 'Roble' },
            { id: 'oscuro', hex: '#8b5a2b', name: 'Nogal' },
            { id: 'ebano', hex: '#3d2817', name: 'Ébano' },
            { id: 'rojo', hex: '#a52a2a', name: 'Caoba' },
            { id: 'amarillo', hex: '#ffd700', name: 'Amarillo' },
            { id: 'naranja', hex: '#ff8c00', name: 'Naranja' },
            { id: 'verde', hex: '#228b22', name: 'Verde' },
            { id: 'azul', hex: '#0050ef', name: 'Azul Francia' }
        ];

        // --- FUNCIÓN MATEMÁTICA EXACTA PARA EL INTERIOR DEL TRIÁNGULO ---
        const getInnerTriangle = (p1, p2, p3, baseThickness, gap) => {
            const offset = (baseThickness / 2) + gap;
            
            const a = p2.distanceTo(p3);
            const b = p3.distanceTo(p1);
            const c = p1.distanceTo(p2);
            const perimeter = a + b + c;
            
            if (perimeter === 0) return [p1, p2, p3];

            // Incentro
            const incenter = new THREE.Vector2(
                (a * p1.x + b * p2.x + c * p3.x) / perimeter,
                (a * p1.y + b * p2.y + c * p3.y) / perimeter
            );
            
            // Fórmula de Herón
            const s = perimeter / 2;
            const area = Math.sqrt(Math.max(0, s * (s - a) * (s - b) * (s - c)));
            const inradius = area / s;
            
            if (inradius <= offset) return [incenter.clone(), incenter.clone(), incenter.clone()];
            
            const scale = (inradius - offset) / inradius;
            
            return [
                incenter.clone().add(p1.clone().sub(incenter).multiplyScalar(scale)),
                incenter.clone().add(p2.clone().sub(incenter).multiplyScalar(scale)),
                incenter.clone().add(p3.clone().sub(incenter).multiplyScalar(scale))
            ];
        };

        // --- ALGORITMO SUTHERLAND-HODGMAN PARA RECORTAR EXCEDENTES DEL INFILL ---
        const clipPolygonAgainstConvex = (subject, clipper) => {
            let outputList = subject;
            for (let i = 0; i < clipper.length; i++) {
                const clipEdgeStart = clipper[i];
                const clipEdgeEnd = clipper[(i + 1) % clipper.length];
                const inputList = outputList;
                outputList = [];
                if (inputList.length === 0) break;

                // Verifica si un punto está hacia el "adentro" del borde de recorte (Orden Antihorario)
                const isInside = (p) => {
                    return (clipEdgeEnd.x - clipEdgeStart.x) * (p.y - clipEdgeStart.y) - (clipEdgeEnd.y - clipEdgeStart.y) * (p.x - clipEdgeStart.x) >= -1e-6; 
                };

                const computeIntersection = (s, e) => {
                    const dx1 = e.x - s.x, dy1 = e.y - s.y;
                    const dx2 = clipEdgeEnd.x - clipEdgeStart.x, dy2 = clipEdgeEnd.y - clipEdgeStart.y;
                    const den = dx1 * dy2 - dy1 * dx2;
                    if (Math.abs(den) < 1e-6) return s; 
                    const t = ((s.x - clipEdgeStart.x) * dy2 - (s.y - clipEdgeStart.y) * dx2) / den;
                    return new THREE.Vector2(s.x + t * dx1, s.y + t * dy1);
                };

                for (let j = 0; j < inputList.length; j++) {
                    const currentPoint = inputList[j];
                    const prevPoint = inputList[(j - 1 + inputList.length) % inputList.length];

                    const curInside = isInside(currentPoint);
                    const prevInside = isInside(prevPoint);

                    if (curInside) {
                        if (!prevInside) outputList.push(computeIntersection(prevPoint, currentPoint));
                        outputList.push(currentPoint);
                    } else if (prevInside) {
                        outputList.push(computeIntersection(prevPoint, currentPoint));
                    }
                }
            }
            return outputList;
        };

        function App() {
            // 1. Cama de Impresión
            const [bedWidth, setBedWidth] = useState(250);
            const [bedHeight, setBedHeight] = useState(250);

            // 2. Medidas del Cuadro
            const [width, setWidth] = useState(388); 
            const [height, setHeight] = useState(488); 
            
            // 3. Guías de Corte
            const [panelCols, setPanelCols] = useState(2);
            const [panelRows, setPanelRows] = useState(2);
            const [showGuides, setShowGuides] = useState(true);
            const [exportSelection, setExportSelection] = useState('single');
            const [exportBase, setExportBase] = useState(true); 
            
            // 4. Estados del patrón Jigumi Base
            const [triangleSide, setTriangleSide] = useState(43.5); 
            const [patternCols, setPatternCols] = useState(10);      
            const [patternRows, setPatternRows] = useState(14);     
            const [thickness, setThickness] = useState(3);          
            const [depth, setDepth] = useState(5);
            const [showBorders, setShowBorders] = useState(true);
            const [isAutoFit, setIsAutoFit] = useState(true); 
            const [mainColor, setMainColor] = useState(WOOD_COLORS[0].hex); 

            // 5. Diseño Libre (INTERACTIVO)
            const [designMode, setDesignMode] = useState(false);
            const [activeTool, setActiveTool] = useState('asanoha'); 
            const [activeColor, setActiveColor] = useState(WOOD_COLORS[2].hex); 
            const [infillThickness, setInfillThickness] = useState(1.5);
            const [clearance, setClearance] = useState(0.15); 
            const [customDesign, setCustomDesign] = useState({}); 
            const customDesignRef = useRef({});

            // Ui State
            const [showConfigModal, setShowConfigModal] = useState(false);
            const [dialog, setDialog] = useState(null); 
            const fileInputRef = useRef(null);

            const showAlert = (msg) => setDialog({ message: msg, type: 'alert' });
            const showConfirm = (msg, onConfirm) => setDialog({ message: msg, type: 'confirm', onConfirm });

            // Three.js Refs
            const mountRef = useRef(null);
            const sceneRef = useRef(null);
            const cameraRef = useRef(null);
            const rendererRef = useRef(null);
            const controlsRef = useRef(null);
            const meshGroupRef = useRef(null);
            const hitboxesGroupRef = useRef(null);
            const guidesGroupRef = useRef(null);
            const singleMeshRef = useRef(null); 
            const panelsRef = useRef([]);

            // Interacción Refs
            const raycasterRef = useRef(new THREE.Raycaster());
            const mouseRef = useRef(new THREE.Vector2());
            const isPaintingRef = useRef(false);
            const hoveredMeshRef = useRef(null);
            const longPressTimerRef = useRef(null);
            const lastHoveredIdRef = useRef(null);

            // Valores numéricos seguros
            const validWidth = Number(width) || 0;
            const validHeight = Number(height) || 0;
            const validTriangleSide = Number(triangleSide) || 43.5;
            const validPatternCols = Number(patternCols) || 1;
            const validPatternRows = Number(patternRows) || 1;
            const validInfillThickness = Number(infillThickness) || 1.5;
            const validClearance = Number(clearance) || 0;

            const hasValidDimensions = validWidth > 0 && validHeight > 0;

            const pw = validWidth > 0 ? validWidth / panelCols : 0;
            const ph = validHeight > 0 ? validHeight / panelRows : 0;
            const SQRT3 = Math.sqrt(3);
            
            const targetInnerW = showBorders ? Math.max(0, validWidth - thickness * 2) : validWidth;
            const targetInnerH = showBorders ? Math.max(0, validHeight - thickness * 2) : validHeight;

            const cellW = isAutoFit ? (validPatternCols > 0 ? targetInnerW / validPatternCols : 0) : validTriangleSide;
            const cellH = isAutoFit ? (validPatternRows > 0 ? targetInnerH / validPatternRows : 0) : (validTriangleSide * SQRT3 / 2);

            const innerW = validPatternCols * cellW;
            const innerH = validPatternRows * cellH;

            // Inicializar Three.js
            useEffect(() => {
                const containerWidth = mountRef.current.clientWidth;
                const containerHeight = mountRef.current.clientHeight;

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0xf0f0f0);
                sceneRef.current = scene;

                const camera = new THREE.PerspectiveCamera(45, containerWidth / containerHeight, 0.1, 2000);
                camera.position.set(0, 0, 600);
                cameraRef.current = camera;

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(containerWidth, containerHeight);
                renderer.shadowMap.enabled = true;
                mountRef.current.appendChild(renderer.domElement);
                rendererRef.current = renderer;

                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controlsRef.current = controls;

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
                dirLight.position.set(100, 100, 200);
                scene.add(dirLight);

                const meshGroup = new THREE.Group();
                scene.add(meshGroup);
                meshGroupRef.current = meshGroup;

                const hitboxesGroup = new THREE.Group();
                hitboxesGroup.position.z = depth / 2 + 1; 
                scene.add(hitboxesGroup);
                hitboxesGroupRef.current = hitboxesGroup;

                const guidesGroup = new THREE.Group();
                scene.add(guidesGroup);
                guidesGroupRef.current = guidesGroup;

                const animate = () => {
                    requestAnimationFrame(animate);
                    if (controlsRef.current) controlsRef.current.update();
                    renderer.render(scene, camera);
                };
                animate();

                const handleResize = () => {
                    if (mountRef.current && rendererRef.current && cameraRef.current) {
                        const newWidth = mountRef.current.clientWidth;
                        const newHeight = mountRef.current.clientHeight;
                        rendererRef.current.setSize(newWidth, newHeight);
                        cameraRef.current.aspect = newWidth / newHeight;
                        cameraRef.current.updateProjectionMatrix();
                    }
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    if (mountRef.current) mountRef.current.removeChild(renderer.domElement);
                };
            }, [depth]);

            useEffect(() => {
                if (controlsRef.current) controlsRef.current.enableRotate = !designMode;
            }, [designMode]);

            const getVertex = (k, j, PXmin, PYmin) => {
                return new THREE.Vector2(PXmin + k * cellW + j * (cellW / 2), PYmin + j * cellH);
            };

            const buildGeometry = () => {
                if (!meshGroupRef.current || !hitboxesGroupRef.current || !hasValidDimensions) return;
                
                const group = meshGroupRef.current;
                while(group.children.length > 0){ 
                    const child = group.children[0];
                    group.remove(child); 
                    if(child.geometry) child.geometry.dispose();
                }
                
                const hGroup = hitboxesGroupRef.current;
                while(hGroup.children.length > 0){
                    const child = hGroup.children[0];
                    hGroup.remove(child);
                    if(child.geometry) child.geometry.dispose();
                    if(child.material) child.material.dispose();
                }

                singleMeshRef.current = null;
                panelsRef.current = [];

                const GLx = validWidth / 2;
                const GLy = validHeight / 2;
                const borderT = showBorders ? thickness : 0;

                const PXmin = -innerW / 2;
                const PXmax = innerW / 2;
                const PYmin = -innerH / 2;
                const PYmax = innerH / 2;

                const renderMinX = Math.max(-GLx + borderT, PXmin);
                const renderMaxX = Math.min(GLx - borderT, PXmax);
                const renderMinY = Math.max(-GLy + borderT, PYmin);
                const renderMaxY = Math.min(GLy - borderT, PYmax);

                if (designMode) {
                    const hitboxMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0, side: THREE.DoubleSide });
                    const marginX = cellW * 1.5;
                    const marginY = cellH * 1.5;

                    for (let j = -1; j <= validPatternRows + 1; j++) {
                        for (let k = -validPatternRows - 2; k <= validPatternCols + 2; k++) {
                            let u1 = getVertex(k, j, PXmin, PYmin);
                            let u2 = getVertex(k+1, j, PXmin, PYmin);
                            let u3 = getVertex(k, j+1, PXmin, PYmin);
                            let uC = new THREE.Vector2((u1.x+u2.x+u3.x)/3, (u1.y+u2.y+u3.y)/3);
                            
                            if (uC.x >= renderMinX - marginX && uC.x <= renderMaxX + marginX && uC.y >= renderMinY - marginY && uC.y <= renderMaxY + marginY) {
                                const shape = new THREE.Shape();
                                shape.moveTo(u1.x, u1.y); shape.lineTo(u2.x, u2.y); shape.lineTo(u3.x, u3.y); shape.closePath();
                                const geo = new THREE.ShapeGeometry(shape);
                                const mesh = new THREE.Mesh(geo, hitboxMat.clone());
                                mesh.userData = { id: `U_${k}_${j}`, V1: u1, V2: u2, V3: u3, C: uC };
                                hGroup.add(mesh);
                            }

                            let d1 = getVertex(k+1, j, PXmin, PYmin);
                            let d2 = getVertex(k+1, j+1, PXmin, PYmin);
                            let d3 = getVertex(k, j+1, PXmin, PYmin);
                            let dC = new THREE.Vector2((d1.x+d2.x+d3.x)/3, (d1.y+d2.y+d3.y)/3);
                            
                            if (dC.x >= renderMinX - marginX && dC.x <= renderMaxX + marginX && dC.y >= renderMinY - marginY && dC.y <= renderMaxY + marginY) {
                                const shape = new THREE.Shape();
                                shape.moveTo(d1.x, d1.y); shape.lineTo(d2.x, d2.y); shape.lineTo(d3.x, d3.y); shape.closePath();
                                const geo = new THREE.ShapeGeometry(shape);
                                const mesh = new THREE.Mesh(geo, hitboxMat.clone());
                                mesh.userData = { id: `D_${k}_${j}`, V1: d1, V2: d2, V3: d3, C: dC };
                                hGroup.add(mesh);
                            }
                        }
                    }
                }

                function clipSegmentToBox(pA, pB, box) {
                    let x0 = pA.x, y0 = pA.y, x1 = pB.x, y1 = pB.y;
                    let dx = x1 - x0, dy = y1 - y0;
                    let p = [-dx, dx, -dy, dy];
                    let q = [x0 - box.minX, box.maxX - x0, y0 - box.minY, box.maxY - y0];
                    let t0 = 0.0, t1 = 1.0;

                    for (let i = 0; i < 4; i++) {
                        if (p[i] === 0) { if (q[i] < 0) return null; } 
                        else {
                            let t = q[i] / p[i];
                            if (p[i] < 0) { if (t > t1) return null; if (t > t0) t0 = t; } 
                            else { if (t < t0) return null; if (t < t1) t1 = t; }
                        }
                    }
                    if (t0 > t1) return null;
                    return { A: new THREE.Vector2(x0 + t0 * dx, y0 + t0 * dy), B: new THREE.Vector2(x0 + t1 * dx, y0 + t1 * dy) };
                }

                function clipPolygonAABB(subjectPolygon, aabb) {
                    let inputList = subjectPolygon;
                    const clipEdge = (edgeIndex) => {
                        let outList = [];
                        for (let i = 0; i < inputList.length; i++) {
                            let s = inputList[i], e = inputList[(i + 1) % inputList.length];
                            let sInside, eInside, intersect;
                            
                            if (edgeIndex === 0) { sInside = s.x >= aabb.minX; eInside = e.x >= aabb.minX; intersect = { x: aabb.minX, y: s.y + (e.y - s.y) * (aabb.minX - s.x) / (e.x - s.x) }; } 
                            else if (edgeIndex === 1) { sInside = s.x <= aabb.maxX; eInside = e.x <= aabb.maxX; intersect = { x: aabb.maxX, y: s.y + (e.y - s.y) * (aabb.maxX - s.x) / (e.x - s.x) }; } 
                            else if (edgeIndex === 2) { sInside = s.y >= aabb.minY; eInside = e.y >= aabb.minY; intersect = { x: s.x + (e.x - s.x) * (aabb.minY - s.y) / (e.y - s.y), y: aabb.minY }; } 
                            else if (edgeIndex === 3) { sInside = s.y <= aabb.maxY; eInside = e.y <= aabb.maxY; intersect = { x: s.x + (e.x - s.x) * (aabb.maxY - s.y) / (e.y - s.y), y: aabb.maxY }; }
                            
                            if (eInside) { if (!sInside) outList.push(intersect); outList.push(e); } 
                            else if (sInside) { outList.push(intersect); }
                        }
                        inputList = outList;
                    };
                    for (let i = 0; i < 4; i++) clipEdge(i);
                    return inputList;
                }

                const rawSegments = [];
                const rawPolygons = [];
                let startJ = showBorders ? 0 : 1;
                let endJ = showBorders ? validPatternRows : validPatternRows - 1;

                // -------------------------------------------------------------
                // LÍNEAS BASE (JIGUMI) - Estas pueden interponerse o cruzarse sin problema
                // -------------------------------------------------------------
                for (let j = startJ; j <= endJ; j++) rawSegments.push({ A: new THREE.Vector2(PXmin, PYmin + j * cellH), B: new THREE.Vector2(PXmax, PYmin + j * cellH), isMain: true });
                for (let k = -validPatternRows - 2; k <= validPatternCols + 2; k++) rawSegments.push({ A: new THREE.Vector2(PXmin + k * cellW, PYmin), B: new THREE.Vector2(PXmin + k * cellW + validPatternRows * (cellW / 2), PYmax), isMain: true });
                for (let k = -2; k <= validPatternCols + validPatternRows + 2; k++) rawSegments.push({ A: new THREE.Vector2(PXmin + k * cellW, PYmin), B: new THREE.Vector2(PXmin + k * cellW - validPatternRows * (cellW / 2), PYmax), isMain: true });

                // -------------------------------------------------------------
                // PROCESAMIENTO DE INFILL: Generación de Polígonos de Precisión
                // -------------------------------------------------------------
                Object.entries(customDesignRef.current).forEach(([id, data]) => {
                    const parts = id.split('_');
                    const type = parts[0], k = parseInt(parts[1]), j = parseInt(parts[2]);
                    
                    let orig_v1, orig_v2, orig_v3;
                    if (type === 'U') { 
                        orig_v1 = getVertex(k, j, PXmin, PYmin); 
                        orig_v2 = getVertex(k+1, j, PXmin, PYmin); 
                        orig_v3 = getVertex(k, j+1, PXmin, PYmin); 
                    } else { 
                        orig_v1 = getVertex(k+1, j, PXmin, PYmin); 
                        orig_v2 = getVertex(k+1, j+1, PXmin, PYmin); 
                        orig_v3 = getVertex(k, j+1, PXmin, PYmin); 
                    }
                    
                    // Límites Interiores Estrictos del Triángulo Actual
                    let [v1, v2, v3] = getInnerTriangle(orig_v1, orig_v2, orig_v3, thickness, validClearance);
                    const clipperPoly = [v1, v2, v3];
                    
                    // Función constructora con CORTADORA DE POLÍGONOS incorporada
                    const addInfill = (A, B) => {
                        let dx = B.x - A.x, dy = B.y - A.y;
                        let len = Math.sqrt(dx*dx + dy*dy);
                        if (len < 0.001) return;
                        let nx = -dy/len, ny = dx/len;
                        let t = validInfillThickness / 2; // Grosor de línea hacia cada lado
                        // Construimos el rectángulo base de la línea
                        let poly = [
                            new THREE.Vector2(A.x + nx*t, A.y + ny*t),
                            new THREE.Vector2(B.x + nx*t, B.y + ny*t),
                            new THREE.Vector2(B.x - nx*t, B.y - ny*t),
                            new THREE.Vector2(A.x - nx*t, A.y - ny*t)
                        ];
                        // RECORTAMOS cualquier exceso que sobresalga de la barrera interior del triángulo
                        poly = clipPolygonAgainstConvex(poly, clipperPoly);
                        if (poly.length >= 3) {
                            rawPolygons.push({ vertices: poly, color: data.color });
                        }
                    };

                    let c = new THREE.Vector2((v1.x+v2.x+v3.x)/3, (v1.y+v2.y+v3.y)/3);
                    let m1 = new THREE.Vector2((v1.x+v2.x)/2, (v1.y+v2.y)/2);
                    let m2 = new THREE.Vector2((v2.x+v3.x)/2, (v2.y+v3.y)/2);
                    let m3 = new THREE.Vector2((v3.x+v1.x)/2, (v3.y+v1.y)/2);

                    if (data.type === 'asanoha') {
                        addInfill(c, v1); addInfill(c, v2); addInfill(c, v3);
                    } 
                    else if (data.type === 'estrella') {
                        addInfill(m1, m2); addInfill(m2, m3); addInfill(m3, m1);
                    }
                    else if (data.type === 'hexagono') {
                        let p1 = new THREE.Vector2(v1.x*2/3 + v2.x/3, v1.y*2/3 + v2.y/3);
                        let p2 = new THREE.Vector2(v1.x/3 + v2.x*2/3, v1.y/3 + v2.y*2/3);
                        let p3 = new THREE.Vector2(v2.x*2/3 + v3.x/3, v2.y*2/3 + v3.y/3);
                        let p4 = new THREE.Vector2(v2.x/3 + v3.x*2/3, v2.y/3 + v3.y*2/3);
                        let p5 = new THREE.Vector2(v3.x*2/3 + v1.x/3, v3.y*2/3 + v1.y/3);
                        let p6 = new THREE.Vector2(v3.x/3 + v1.x*2/3, v3.y/3 + v1.y*2/3);
                        addInfill(p1, p2); addInfill(p2, p3); addInfill(p3, p4);
                        addInfill(p4, p5); addInfill(p5, p6); addInfill(p6, p1);
                    }
                    else if (data.type === 'sakura') {
                        let p1 = new THREE.Vector2(v1.x*2/3 + v2.x/3, v1.y*2/3 + v2.y/3);
                        let p2 = new THREE.Vector2(v1.x/3 + v2.x*2/3, v1.y/3 + v2.y*2/3);
                        let p3 = new THREE.Vector2(v2.x*2/3 + v3.x/3, v2.y*2/3 + v3.y/3);
                        let p4 = new THREE.Vector2(v2.x/3 + v3.x*2/3, v2.y/3 + v3.y*2/3);
                        let p5 = new THREE.Vector2(v3.x*2/3 + v1.x/3, v3.y*2/3 + v1.y/3);
                        let p6 = new THREE.Vector2(v3.x/3 + v1.x*2/3, v3.y/3 + v1.y*2/3);
                        addInfill(p1, p2); addInfill(p2, p3); addInfill(p3, p4);
                        addInfill(p4, p5); addInfill(p5, p6); addInfill(p6, p1);
                        addInfill(m1, new THREE.Vector2((p1.x+p2.x)/2, (p1.y+p2.y)/2));
                        addInfill(m2, new THREE.Vector2((p3.x+p4.x)/2, (p3.y+p4.y)/2));
                        addInfill(m3, new THREE.Vector2((p5.x+p6.x)/2, (p5.y+p6.y)/2));
                    }
                    else if (data.type === 'kikko') {
                        let p1 = v1.clone().lerp(v2, 1/3), p2 = v1.clone().lerp(v2, 2/3);
                        let p3 = v2.clone().lerp(v3, 1/3), p4 = v2.clone().lerp(v3, 2/3);
                        let p5 = v3.clone().lerp(v1, 1/3), p6 = v3.clone().lerp(v1, 2/3);
                        addInfill(p1, p2); addInfill(p2, p3); addInfill(p3, p4);
                        addInfill(p4, p5); addInfill(p5, p6); addInfill(p6, p1);
                        addInfill(c, p1); addInfill(c, p3); addInfill(c, p5);
                    }
                    else if (data.type === 'goma') {
                        addInfill(m1, m3); addInfill(v1, m2); 
                    }
                    else if (data.type === 'bishamon') {
                        addInfill(c, m1); addInfill(c, m2); addInfill(c, m3);
                    }
                    else if (data.type === 'pleno') {
                        rawPolygons.push({ vertices: [v1, v2, v3], color: data.color });
                    }
                });

                const createGeosForBox = (box, offX, offY, isPanel = true) => {
                    const geosByColor = { main: [] }; 
                    const solidGeosByColor = {};      
                    const eps = 0.01;

                    let clipBox = {
                        minX: Math.max(box.minX, renderMinX), maxX: Math.min(box.maxX, renderMaxX),
                        minY: Math.max(box.minY, renderMinY), maxY: Math.min(box.maxY, renderMaxY)
                    };

                    if (clipBox.maxX > clipBox.minX && clipBox.maxY > clipBox.minY) {
                        rawSegments.forEach(seg => {
                            let clp = clipSegmentToBox(seg.A, seg.B, clipBox);
                            if (!clp) return;

                            let dx = clp.B.x - clp.A.x, dy = clp.B.y - clp.A.y;
                            let len = Math.sqrt(dx*dx + dy*dy);
                            if (len < 0.001) return;

                            let dir = new THREE.Vector2(dx/len, dy/len);
                            let baseT = thickness; // Ahora solo pasa isMain por aquí

                            const getAdjust = (P) => {
                                let hitsX = (Math.abs(Math.abs(P.x) - GLx) < eps);
                                let hitsY = (Math.abs(Math.abs(P.y) - GLy) < eps);
                                
                                if (hitsX || hitsY) {
                                    let delta = 0;
                                    if (Math.abs(dx) > 0.001 && Math.abs(dy) > 0.001) {
                                        if (hitsX && hitsY) delta = (baseT/2) * Math.max(Math.abs(dy/dx), Math.abs(dx/dy));
                                        else if (hitsX) delta = (baseT/2) * Math.abs(dy/dx);
                                        else if (hitsY) delta = (baseT/2) * Math.abs(dx/dy);
                                    }
                                    return -Math.min(delta, baseT * 2);
                                } else {
                                    let touchesPanelBoundary = (
                                        Math.abs(P.x - box.minX) < eps || Math.abs(P.x - box.maxX) < eps ||
                                        Math.abs(P.y - box.minY) < eps || Math.abs(P.y - box.maxY) < eps
                                    );
                                    if (isPanel && touchesPanelBoundary) return 0; 
                                    return baseT * 0.65; 
                                }
                            };

                            let adjA = getAdjust(clp.A); let adjB = getAdjust(clp.B);
                            let newA = clp.A.clone().addScaledVector(dir, -adjA);
                            let newB = clp.B.clone().addScaledVector(dir, adjB);

                            let finalDx = newB.x - newA.x, finalDy = newB.y - newA.y;
                            let finalLen = Math.sqrt(finalDx*finalDx + finalDy*finalDy);
                            if (finalLen < 0.01) return;

                            let ang = Math.atan2(finalDy, finalDx);
                            let midX = (newA.x + newB.x) / 2, midY = (newA.y + newB.y) / 2;

                            let curT = baseT;
                            if (isPanel && Math.abs(finalDy) < 0.01) {
                                if (Math.abs(clp.A.y - box.maxY) < eps) { curT = baseT / 2; midY -= baseT / 4; }
                                else if (Math.abs(clp.A.y - box.minY) < eps) { curT = baseT / 2; midY += baseT / 4; }
                            }

                            const geo = new THREE.BoxGeometry(finalLen, curT, depth);
                            const m4 = new THREE.Matrix4();
                            m4.makeRotationZ(ang);
                            m4.setPosition(midX - offX, midY - offY, 0);
                            geo.applyMatrix4(m4);
                            
                            geosByColor.main.push(geo);
                        });

                        rawPolygons.forEach(poly => {
                            let clipped = clipPolygonAABB(poly.vertices, clipBox);
                            if (clipped.length >= 3) {
                                const shape = new THREE.Shape();
                                shape.moveTo(clipped[0].x, clipped[0].y);
                                for(let i=1; i<clipped.length; i++) shape.lineTo(clipped[i].x, clipped[i].y);
                                shape.closePath();
                                
                                // FIX: Usamos la profundidad (depth) real del cuadro, no el grosor del borde (validInfillThickness)
                                const extrudeSettings = { depth: depth, bevelEnabled: false };
                                const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                                geo.translate(-offX, -offY, -depth / 2); 
                                
                                if(!solidGeosByColor[poly.color]) solidGeosByColor[poly.color] = [];
                                solidGeosByColor[poly.color].push(geo);
                            }
                        });
                    }

                    if (showBorders) {
                        const addR = (rMinX, rMaxX, rMinY, rMaxY) => {
                            let x1 = Math.max(rMinX, box.minX), x2 = Math.min(rMaxX, box.maxX);
                            let y1 = Math.max(rMinY, box.minY), y2 = Math.min(rMaxY, box.maxY);
                            if (x2 > x1 && y2 > y1) {
                                const geo = new THREE.BoxGeometry(x2 - x1 + 0.02, y2 - y1 + 0.02, depth);
                                const m4 = new THREE.Matrix4();
                                m4.setPosition((x1 + x2)/2 - offX, (y1 + y2)/2 - offY, 0);
                                geo.applyMatrix4(m4);
                                geosByColor.main.push(geo);
                            }
                        };
                        addR(-GLx, renderMinX, -GLy, GLy); addR(renderMaxX, GLx, -GLy, GLy);  
                        addR(renderMinX, renderMaxX, -GLy, renderMinY); addR(renderMinX, renderMaxX, renderMaxY, GLy);  
                    }
                    return { geosByColor, solidGeosByColor };
                };

                const mainMat = new THREE.MeshLambertMaterial({ color: mainColor }); 
                
                const createMeshGroup = (geometries, userData) => {
                    const localGroup = new THREE.Group();
                    
                    Object.entries(geometries.geosByColor).forEach(([colorKey, geos]) => {
                        if (geos.length > 0) {
                            const merged = THREE.BufferGeometryUtils.mergeBufferGeometries(geos);
                            const isMain = colorKey === 'main';
                            const mat = isMain ? mainMat : new THREE.MeshLambertMaterial({ color: colorKey });
                            const mesh = new THREE.Mesh(merged, mat);
                            mesh.userData = { isMain };
                            localGroup.add(mesh);
                        }
                    });

                    Object.entries(geometries.solidGeosByColor).forEach(([colorKey, geos]) => {
                        if (geos.length > 0) {
                            const merged = THREE.BufferGeometryUtils.mergeBufferGeometries(geos);
                            const mat = new THREE.MeshLambertMaterial({ color: colorKey });
                            const mesh = new THREE.Mesh(merged, mat);
                            mesh.userData = { isMain: false };
                            localGroup.add(mesh);
                        }
                    });

                    localGroup.userData = userData;
                    return localGroup;
                };

                for (let py = 0; py < panelRows; py++) {
                    for (let px = 0; px < panelCols; px++) {
                        let cx = -validWidth/2 + pw/2 + px * pw, cy = -validHeight/2 + ph/2 + py * ph;
                        const panelBox = { minX: cx - pw/2, maxX: cx + pw/2, minY: cy - ph/2, maxY: cy + ph/2 };
                        const geometries = createGeosForBox(panelBox, cx, cy, true);
                        
                        if (Object.values(geometries.geosByColor).some(arr => arr.length > 0) || Object.values(geometries.solidGeosByColor).some(arr => arr.length > 0)) {
                            const pGroup = createMeshGroup(geometries, { px, py, name: `Panel ${px+1}x${py+1}` });
                            pGroup.position.set((px - (panelCols-1)/2)*pw, (py - (panelRows-1)/2)*ph, 0);
                            panelsRef.current.push(pGroup);
                        }
                    }
                }

                const fullGeometries = createGeosForBox({minX:-validWidth/2, maxX:validWidth/2, minY:-validHeight/2, maxY:validHeight/2}, 0, 0, false);
                if (Object.values(fullGeometries.geosByColor).some(arr => arr.length > 0) || Object.values(fullGeometries.solidGeosByColor).some(arr => arr.length > 0)) {
                    singleMeshRef.current = createMeshGroup(fullGeometries, { name: 'Full' });
                    group.add(singleMeshRef.current);
                }

            };

            useEffect(() => {
                customDesignRef.current = customDesign; 
                buildGeometry();
            }, [validWidth, validHeight, validTriangleSide, validPatternCols, validPatternRows, thickness, validInfillThickness, validClearance, depth, panelCols, panelRows, showBorders, isAutoFit, mainColor, customDesign, designMode]);

            useEffect(() => {
                if (!guidesGroupRef.current) return;
                const group = guidesGroupRef.current;
                while(group.children.length > 0){ 
                    const child = group.children[0];
                    group.remove(child); 
                    if(child.geometry) child.geometry.dispose();
                    if(child.material) child.material.dispose();
                }

                if (!hasValidDimensions || !showGuides || (panelCols === 1 && panelRows === 1)) return;

                const guideMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.6, side: THREE.DoubleSide });

                for (let i = 1; i < panelCols; i++) {
                    const cutX = -validWidth/2 + i * pw;
                    const geo = new THREE.BoxGeometry(1.5, validHeight + 20, depth + 10);
                    const mesh = new THREE.Mesh(geo, guideMaterial);
                    mesh.position.set(cutX, 0, 0);
                    group.add(mesh);
                }
                for (let j = 1; j < panelRows; j++) {
                    const cutY = -validHeight/2 + j * ph;
                    const geo = new THREE.BoxGeometry(validWidth + 20, 1.5, depth + 10);
                    const mesh = new THREE.Mesh(geo, guideMaterial);
                    mesh.position.set(0, cutY, 0);
                    group.add(mesh);
                }
            }, [validWidth, validHeight, panelCols, panelRows, pw, ph, showGuides, depth]);

            const paintTriangle = (id) => {
                setCustomDesign(prev => {
                    const newDesign = { ...prev };
                    if (activeTool === 'eraser') {
                        delete newDesign[id];
                    } else {
                        newDesign[id] = { type: activeTool, color: activeColor };
                    }
                    return newDesign;
                });
            };

            const handlePointerDown = (e) => {
                if (!designMode) return;
                if (e.button !== 0) return; 
                isPaintingRef.current = true;
                
                if (hoveredMeshRef.current) {
                    const id = hoveredMeshRef.current.userData.id;
                    lastHoveredIdRef.current = id;
                    paintTriangle(id);
                    
                    longPressTimerRef.current = setTimeout(() => {
                        setCustomDesign(prev => {
                            const newDesign = { ...prev };
                            delete newDesign[id];
                            return newDesign;
                        });
                        if (hoveredMeshRef.current) hoveredMeshRef.current.material.opacity = 0;
                    }, 2000);
                }
            };

            const handlePointerMove = (e) => {
                if (!designMode || !rendererRef.current) return;
                
                const rect = rendererRef.current.domElement.getBoundingClientRect();
                mouseRef.current.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouseRef.current.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                
                raycasterRef.current.setFromCamera(mouseRef.current, cameraRef.current);
                const intersects = raycasterRef.current.intersectObjects(hitboxesGroupRef.current.children);
                
                if (hoveredMeshRef.current && hoveredMeshRef.current !== intersects[0]?.object) {
                    hoveredMeshRef.current.material.opacity = 0;
                }
                
                if (intersects.length > 0) {
                    hoveredMeshRef.current = intersects[0].object;
                    hoveredMeshRef.current.material.opacity = 0.4;
                    
                    const id = hoveredMeshRef.current.userData.id;
                    if (isPaintingRef.current && lastHoveredIdRef.current !== id) {
                        clearTimeout(longPressTimerRef.current); 
                        lastHoveredIdRef.current = id;
                        paintTriangle(id);
                    }
                } else {
                    hoveredMeshRef.current = null;
                    if (isPaintingRef.current) {
                        clearTimeout(longPressTimerRef.current);
                        lastHoveredIdRef.current = null;
                    }
                }
            };

            const handlePointerUp = () => {
                isPaintingRef.current = false;
                clearTimeout(longPressTimerRef.current);
                lastHoveredIdRef.current = null;
            };

            const handlePointerLeave = () => {
                isPaintingRef.current = false;
                clearTimeout(longPressTimerRef.current);
                lastHoveredIdRef.current = null;
                if (hoveredMeshRef.current) {
                    hoveredMeshRef.current.material.opacity = 0;
                    hoveredMeshRef.current = null;
                }
            };

            const autoAdjustPattern = () => {
                if (validWidth > 0 && validHeight > 0 && validTriangleSide > 0) {
                    let targetW = validWidth - thickness * 2;
                    let targetH = validHeight - thickness * 2;
                    if (targetW < 0) targetW = validWidth;
                    if (targetH < 0) targetH = validHeight;
                    setPatternCols(Math.floor(targetW / validTriangleSide));
                    setPatternRows(Math.floor(targetH / (validTriangleSide * Math.sqrt(3)/2)));
                }
            };

            const fillAllWithPattern = () => {
                if(!hitboxesGroupRef.current) return;
                const newDesign = { ...customDesign };
                hitboxesGroupRef.current.children.forEach(mesh => {
                    newDesign[mesh.userData.id] = { type: activeTool, color: activeColor };
                });
                setCustomDesign(newDesign);
            };

            const clearAllPattern = () => {
                showConfirm("¿Seguro que deseas borrar todo tu diseño interior?", () => {
                    setCustomDesign({});
                });
            };

            // --- BOM Y EXPORTAR PIEZAS ÚNICAS ---
            const bomItems = useMemo(() => {
                const counts = {};
                Object.values(customDesign).forEach(d => {
                    const key = `${d.type}_${d.color}`;
                    if(!counts[key]) counts[key] = { type: d.type, color: d.color, count: 0 };
                    counts[key].count++;
                });
                return Object.values(counts).sort((a,b) => b.count - a.count);
            }, [customDesign]);

            const exportSingleTool = (toolType, toolColor) => {
                const scene = new THREE.Scene();
                const baseT = validInfillThickness;

                let v1_orig = new THREE.Vector2(-cellW/2, -cellH/3);
                let v2_orig = new THREE.Vector2(cellW/2, -cellH/3);
                let v3_orig = new THREE.Vector2(0, cellH*2/3);

                let [v1, v2, v3] = getInnerTriangle(v1_orig, v2_orig, v3_orig, thickness, validClearance);

                const rawPolygons = [];
                const clipperPoly = [v1, v2, v3];

                // FIX: Ahora generamos polígonos recortados usando el clipper en vez de lineas crudas
                const addInfill = (A, B) => {
                    let dx = B.x - A.x, dy = B.y - A.y;
                    let len = Math.sqrt(dx*dx + dy*dy);
                    if (len < 0.001) return;
                    let nx = -dy/len, ny = dx/len;
                    let t = validInfillThickness / 2;
                    let poly = [
                        new THREE.Vector2(A.x + nx*t, A.y + ny*t),
                        new THREE.Vector2(B.x + nx*t, B.y + ny*t),
                        new THREE.Vector2(B.x - nx*t, B.y - ny*t),
                        new THREE.Vector2(A.x - nx*t, A.y - ny*t)
                    ];
                    poly = clipPolygonAgainstConvex(poly, clipperPoly);
                    if (poly.length >= 3) {
                        rawPolygons.push({ vertices: poly, color: toolColor });
                    }
                };

                let c = new THREE.Vector2((v1.x+v2.x+v3.x)/3, (v1.y+v2.y+v3.y)/3);
                let m1 = new THREE.Vector2((v1.x+v2.x)/2, (v1.y+v2.y)/2);
                let m2 = new THREE.Vector2((v2.x+v3.x)/2, (v2.y+v3.y)/2);
                let m3 = new THREE.Vector2((v3.x+v1.x)/2, (v3.y+v1.y)/2);

                if (toolType === 'asanoha') {
                    addInfill(c, v1); addInfill(c, v2); addInfill(c, v3);
                } else if (toolType === 'estrella') {
                    addInfill(m1, m2); addInfill(m2, m3); addInfill(m3, m1);
                } else if (toolType === 'hexagono') {
                    let p1 = new THREE.Vector2(v1.x*2/3 + v2.x/3, v1.y*2/3 + v2.y/3), p2 = new THREE.Vector2(v1.x/3 + v2.x*2/3, v1.y/3 + v2.y*2/3);
                    let p3 = new THREE.Vector2(v2.x*2/3 + v3.x/3, v2.y*2/3 + v3.y/3), p4 = new THREE.Vector2(v2.x/3 + v3.x*2/3, v2.y/3 + v3.y*2/3);
                    let p5 = new THREE.Vector2(v3.x*2/3 + v1.x/3, v3.y*2/3 + v1.y/3), p6 = new THREE.Vector2(v3.x/3 + v1.x*2/3, v3.y/3 + v1.y*2/3);
                    addInfill(p1, p2); addInfill(p2, p3); addInfill(p3, p4);
                    addInfill(p4, p5); addInfill(p5, p6); addInfill(p6, p1);
                } else if (toolType === 'sakura') {
                    let p1 = new THREE.Vector2(v1.x*2/3 + v2.x/3, v1.y*2/3 + v2.y/3), p2 = new THREE.Vector2(v1.x/3 + v2.x*2/3, v1.y/3 + v2.y*2/3);
                    let p3 = new THREE.Vector2(v2.x*2/3 + v3.x/3, v2.y*2/3 + v3.y/3), p4 = new THREE.Vector2(v2.x/3 + v3.x*2/3, v2.y/3 + v3.y*2/3);
                    let p5 = new THREE.Vector2(v3.x*2/3 + v1.x/3, v3.y*2/3 + v1.y/3), p6 = new THREE.Vector2(v3.x/3 + v1.x*2/3, v3.y/3 + v1.y*2/3);
                    addInfill(p1, p2); addInfill(p2, p3); addInfill(p3, p4);
                    addInfill(p4, p5); addInfill(p5, p6); addInfill(p6, p1);
                    addInfill(m1, new THREE.Vector2((p1.x+p2.x)/2, (p1.y+p2.y)/2));
                    addInfill(m2, new THREE.Vector2((p3.x+p4.x)/2, (p3.y+p4.y)/2));
                    addInfill(m3, new THREE.Vector2((p5.x+p6.x)/2, (p5.y+p6.y)/2));
                } else if (toolType === 'kikko') {
                    let p1 = v1.clone().lerp(v2, 1/3), p2 = v1.clone().lerp(v2, 2/3);
                    let p3 = v2.clone().lerp(v3, 1/3), p4 = v2.clone().lerp(v3, 2/3);
                    let p5 = v3.clone().lerp(v1, 1/3), p6 = v3.clone().lerp(v1, 2/3);
                    addInfill(p1, p2); addInfill(p2, p3); addInfill(p3, p4);
                    addInfill(p4, p5); addInfill(p5, p6); addInfill(p6, p1);
                    addInfill(c, p1); addInfill(c, p3); addInfill(c, p5);
                } else if (toolType === 'goma') {
                    addInfill(m1, m3); addInfill(v1, m2);
                } else if (toolType === 'bishamon') {
                    addInfill(c, m1); addInfill(c, m2); addInfill(c, m3);
                } else if (toolType === 'pleno') {
                    rawPolygons.push({ vertices: [v1, v2, v3], color: toolColor });
                }

                const material = new THREE.MeshBasicMaterial();

                rawPolygons.forEach(poly => {
                    const shape = new THREE.Shape();
                    shape.moveTo(poly.vertices[0].x, poly.vertices[0].y);
                    for(let i=1; i<poly.vertices.length; i++) shape.lineTo(poly.vertices[i].x, poly.vertices[i].y);
                    shape.closePath();
                    // FIX: Siempre extruimos con 'depth' en lugar de usar el grosor de línea 2D
                    const geo = new THREE.ExtrudeGeometry(shape, { depth: depth, bevelEnabled: false });
                    geo.translate(0, 0, -depth / 2);
                    scene.add(new THREE.Mesh(geo, material));
                });

                const exporter = new THREE.STLExporter();
                const stlString = exporter.parse(scene);
                const blob = new Blob([stlString], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Kumiko_${toolType}_${Math.round(cellW)}x${Math.round(cellH)}.stl`;
                link.click();
            };

            // --- JSON SAVE / LOAD ---
            const downloadJSON = () => {
                const configObj = {
                    width, height, panelCols, panelRows,
                    triangleSide, patternCols, patternRows, thickness, depth,
                    showBorders, isAutoFit, mainColor, exportBase, infillThickness, clearance,
                    customDesign
                };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(configObj, null, 2));
                const link = document.createElement("a");
                link.href = dataStr;
                link.download = `Kumiko_Proyecto_${width}x${height}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const uploadJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        if(parsed.width) setWidth(parsed.width);
                        if(parsed.height) setHeight(parsed.height);
                        if(parsed.panelCols) setPanelCols(parsed.panelCols);
                        if(parsed.panelRows) setPanelRows(parsed.panelRows);
                        if(parsed.triangleSide) setTriangleSide(parsed.triangleSide);
                        if(parsed.patternCols) setPatternCols(parsed.patternCols);
                        if(parsed.patternRows) setPatternRows(parsed.patternRows);
                        if(parsed.thickness) setThickness(parsed.thickness);
                        if(parsed.depth) setDepth(parsed.depth);
                        if(parsed.showBorders !== undefined) setShowBorders(parsed.showBorders);
                        if(parsed.isAutoFit !== undefined) setIsAutoFit(parsed.isAutoFit);
                        if(parsed.mainColor) setMainColor(parsed.mainColor);
                        if(parsed.exportBase !== undefined) setExportBase(parsed.exportBase);
                        if(parsed.infillThickness) setInfillThickness(parsed.infillThickness);
                        if(parsed.clearance !== undefined) setClearance(parsed.clearance);
                        if(parsed.customDesign) {
                            setCustomDesign(parsed.customDesign);
                            customDesignRef.current = parsed.customDesign;
                        }
                        setShowConfigModal(false);
                        showAlert("¡Proyecto cargado exitosamente!");
                    } catch (err) {
                        showAlert("Error al leer el archivo JSON. Verifica que sea el correcto.");
                    }
                };
                reader.readAsText(file);
                e.target.value = null; 
            };

            const exportFile = (format) => {
                if (!hasValidDimensions) return showAlert("Medidas inválidas.");
                try {
                    const exportScene = new THREE.Scene();
                    let filename = "";

                    const processMeshForExport = (meshGroup) => {
                        const newGroup = new THREE.Group();
                        meshGroup.children.forEach(child => {
                            if (!exportBase && child.userData.isMain) return; 
                            newGroup.add(child.clone());
                        });
                        return newGroup;
                    };

                    if (exportSelection === 'all') {
                        if (format !== 'stl') return showAlert("La descarga en ZIP solo está disponible para STL.");
                        if (panelsRef.current.length === 0) return showAlert("No hay paneles para exportar.");
                        
                        const zip = {}; 
                        const stlExp = new THREE.STLExporter();
                        panelsRef.current.forEach(p => {
                            const sc = new THREE.Scene(); 
                            const cl = processMeshForExport(p);
                            if (cl.children.length === 0) return; 
                            cl.position.set(0,0,0); 
                            sc.add(cl);
                            zip[`kumiko_${p.userData.name.replace(/ /g,'_')}.stl`] = new TextEncoder().encode(stlExp.parse(sc));
                        });
                        
                        if (Object.keys(zip).length === 0) return showAlert("No hay geometría para exportar con la configuración actual.");

                        const blob = new Blob([window.fflate.zipSync(zip)], { type: 'application/zip' });
                        const link = document.createElement('a'); link.href = URL.createObjectURL(blob); 
                        link.download = `Kumiko_Paneles_${validWidth}x${validHeight}.zip`; link.click();
                        return;
                    } else if (exportSelection === 'single') {
                        if (!singleMeshRef.current) return showAlert("La malla no está lista.");
                        const processedMesh = processMeshForExport(singleMeshRef.current);
                        if (processedMesh.children.length === 0) return showAlert("No hay geometría para exportar. ¡Pinta algún relleno o activa la estructura base!");
                        exportScene.add(processedMesh);
                        filename = `Kumiko_ModeloEntero_${validWidth}x${validHeight}.${format}`;
                    } else {
                        const panel = panelsRef.current.find(x => x.userData.name === exportSelection); 
                        if(!panel) return showAlert("Panel no encontrado.");
                        const processedMesh = processMeshForExport(panel);
                        if (processedMesh.children.length === 0) return showAlert("Ese panel no tiene geometría para exportar.");
                        processedMesh.position.set(0,0,0); exportScene.add(processedMesh); 
                        filename = `Kumiko_${exportSelection.replace(/ /g, '_')}.${format}`;
                    }

                    let fileStringOrBuffer;
                    let mimeType;

                    if (format === '3mf') {
                        const exporter = new THREE['3MFExporter']();
                        fileStringOrBuffer = exporter.parse(exportScene);
                        mimeType = 'application/vnd.ms-3mfdocument';
                    } else {
                        const exporter = new THREE.STLExporter();
                        fileStringOrBuffer = exporter.parse(exportScene);
                        mimeType = 'text/plain';
                    }
                    
                    const blob = new Blob([fileStringOrBuffer], { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a'); link.style.display = 'none'; link.href = url;
                    link.download = filename; document.body.appendChild(link); link.click(); document.body.removeChild(link);
                } catch (error) {
                    console.error(error); showAlert("Error en exportación: " + error.message);
                }
            };

            const handleNumberInput = (setter) => (e) => {
                const val = e.target.value; setter(val === '' ? '' : Number(val));
            };

            return (
                <div className="flex h-full relative text-xs">
                    
                    {/* CUSTOM ALERT / CONFIRM DIALOG */}
                    {dialog && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 rounded-lg shadow-2xl w-full max-w-sm text-center">
                                <p className="text-gray-800 font-bold mb-6 text-sm">{dialog.message}</p>
                                <div className="flex gap-2 justify-center">
                                    {dialog.type === 'confirm' && (
                                        <button onClick={() => setDialog(null)} className="w-1/2 px-4 py-2 border border-gray-300 bg-gray-100 text-gray-800 hover:bg-gray-200 rounded font-bold transition-colors">Cancelar</button>
                                    )}
                                    <button onClick={() => { 
                                        if(dialog.onConfirm) dialog.onConfirm(); 
                                        setDialog(null); 
                                    }} className={`${dialog.type === 'confirm' ? 'w-1/2' : 'w-full'} px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-bold transition-colors`}>Aceptar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showConfigModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-lg shadow-2xl w-full max-w-sm">
                                <h2 className="text-xl font-bold mb-2 text-gray-800 text-center">Gestión de Proyectos</h2>
                                <p className="text-xs text-gray-500 mb-6 text-center">Guarda tu diseño actual en un archivo JSON o carga uno previo.</p>
                                
                                <div className="space-y-3">
                                    <button onClick={downloadJSON} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded text-sm font-bold transition-colors shadow-sm flex items-center justify-center gap-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                        Guardar Proyecto (.json)
                                    </button>
                                    
                                    <div className="relative">
                                        <input 
                                            type="file" 
                                            accept=".json" 
                                            onChange={uploadJSON} 
                                            ref={fileInputRef}
                                            className="hidden" 
                                        />
                                        <button onClick={() => fileInputRef.current.click()} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded text-sm font-bold transition-colors shadow-sm flex items-center justify-center gap-2">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                            Cargar Proyecto (.json)
                                        </button>
                                    </div>
                                </div>

                                <button onClick={() => setShowConfigModal(false)} className="w-full text-gray-500 hover:text-gray-800 hover:bg-gray-100 text-sm py-2 mt-4 rounded transition-colors font-medium">
                                    Cerrar
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="w-80 bg-white shadow-xl z-10 flex flex-col overflow-y-auto shrink-0">
                        <div className="p-4 border-b bg-gray-50 flex justify-between items-center sticky top-0 z-20">
                            <div>
                                <h1 className="text-lg font-bold text-gray-800 uppercase tracking-tighter">Kumiko Maestro</h1>
                                <p className="text-[10px] font-semibold text-emerald-600 uppercase mt-0.5 tracking-wider">Diseño y Fabricación</p>
                            </div>
                            <button 
                                onClick={() => setShowConfigModal(true)}
                                className="text-gray-500 hover:text-blue-600 transition-colors p-2 bg-white rounded-full shadow-sm border hover:shadow-md" 
                                title="Guardar/Cargar Proyecto"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                            </button>
                        </div>
                        
                        <div className="p-4 space-y-4 flex-grow">
                            
                            <div className="flex bg-gray-100 p-1 rounded-lg shadow-inner">
                                <button 
                                    onClick={() => setDesignMode(false)}
                                    className={`w-1/2 py-2 rounded text-[11px] font-bold transition-all ${!designMode ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    ⚙️ Estructura
                                </button>
                                <button 
                                    onClick={() => setDesignMode(true)}
                                    className={`w-1/2 py-2 rounded text-[11px] font-bold transition-all ${designMode ? 'bg-white shadow text-emerald-600' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    🎨 Pintar Infill
                                </button>
                            </div>

                            {!designMode ? (
                                <div className="animate-fade-in space-y-4">
                                    <section>
                                        <h2 className="font-bold text-blue-600 uppercase mb-2">1. Medidas Cuadro</h2>
                                        <div className="flex gap-2">
                                            <div className="w-1/2"><label className="text-gray-400">Ancho (X)</label><input type="number" value={width} onChange={handleNumberInput(setWidth)} className="w-full border p-1 rounded font-bold" /></div>
                                            <div className="w-1/2"><label className="text-gray-400">Alto (Y)</label><input type="number" value={height} onChange={handleNumberInput(setHeight)} className="w-full border p-1 rounded font-bold" /></div>
                                        </div>
                                    </section>

                                    <section className="bg-gray-100 p-2 rounded border border-gray-200">
                                        <h2 className="font-bold text-gray-700 uppercase mb-2 text-[10px]">Color Estructura Base</h2>
                                        <div className="flex gap-1 flex-wrap">
                                            {WOOD_COLORS.map(color => (
                                                <button 
                                                    key={'main_'+color.id}
                                                    onClick={() => setMainColor(color.hex)}
                                                    className={`h-5 w-5 rounded-full border transition-transform ${mainColor === color.hex ? 'border-blue-500 scale-125 shadow-md' : 'border-gray-300 hover:scale-110'}`}
                                                    style={{ backgroundColor: color.hex }}
                                                    title={color.name}
                                                ></button>
                                            ))}
                                        </div>
                                    </section>
                                    
                                    <section className="bg-blue-50 p-2 rounded border border-blue-100">
                                        <h2 className="font-bold text-blue-700 uppercase mb-2">2. Patrón Base (Jigumi)</h2>
                                        <label className="flex items-center gap-2 mb-2"><input type="checkbox" checked={showBorders} onChange={e => setShowBorders(e.target.checked)} /> Marco Sólido</label>
                                        <label className="flex items-center gap-2 mb-2 text-blue-800 font-bold"><input type="checkbox" checked={isAutoFit} onChange={e => setIsAutoFit(e.target.checked)} /> Auto-encajar al Marco</label>
                                        
                                        {!isAutoFit && (
                                            <div className="mb-2">
                                                <label className="text-gray-500 font-bold">Pitch (Triángulo)</label>
                                                <input type="number" step="0.5" value={triangleSide} onChange={handleNumberInput(setTriangleSide)} className="w-full border p-1 rounded font-mono" />
                                            </div>
                                        )}

                                        <div className="flex gap-2 mb-2">
                                            <div className="w-1/2"><label className="text-[10px] text-gray-400">Columnas (X)</label><input type="number" value={patternCols} onChange={handleNumberInput(setPatternCols)} className="w-full border p-1 rounded font-mono" /></div>
                                            <div className="w-1/2"><label className="text-[10px] text-gray-400">Filas (Y)</label><input type="number" value={patternRows} onChange={handleNumberInput(setPatternRows)} className="w-full border p-1 rounded font-mono" /></div>
                                        </div>
                                        
                                        <button onClick={autoAdjustPattern} className="mt-1 mb-2 w-full text-[10px] bg-white hover:bg-gray-100 border py-1 rounded font-bold transition-colors">⚖️ Recalcular Cuadrícula</button>
                                        
                                        <div className="mt-2 flex gap-2">
                                            <div className="w-1/2"><label className="text-[10px] text-gray-400">Grosor Principal</label><input type="number" step="0.5" value={thickness} onChange={handleNumberInput(setThickness)} className="w-full border p-1 rounded" /></div>
                                            <div className="w-1/2"><label className="text-[10px] text-gray-400">Z (Altura 3D)</label><input type="number" value={depth} onChange={handleNumberInput(setDepth)} className="w-full border p-1 rounded" /></div>
                                        </div>
                                    </section>
                                    
                                    <section>
                                        <div className="flex justify-between items-center mb-2">
                                            <h2 className="font-bold text-gray-600 uppercase">3. Corte para Impresora</h2>
                                            <label className="flex items-center gap-1 text-[10px] text-red-600 font-bold bg-red-50 px-1.5 py-0.5 rounded cursor-pointer">
                                                <input type="checkbox" checked={showGuides} onChange={e => setShowGuides(e.target.checked)} /> Ver Láser
                                            </label>
                                        </div>
                                        <div className="flex gap-2">
                                            <div className="w-1/2"><label className="text-gray-400">División X</label><input type="number" value={panelCols} onChange={e => setPanelCols(Math.max(1, Number(e.target.value)))} className="w-full border p-1 rounded" /></div>
                                            <div className="w-1/2"><label className="text-gray-400">División Y</label><input type="number" value={panelRows} onChange={e => setPanelRows(Math.max(1, Number(e.target.value)))} className="w-full border p-1 rounded" /></div>
                                        </div>
                                    </section>
                                </div>
                            ) : (
                                <div className="animate-fade-in space-y-4">
                                    <div className="bg-emerald-50 text-emerald-800 p-2 rounded text-[10px] border border-emerald-200 shadow-sm leading-tight">
                                        <b>Modo Activo:</b> La cámara está bloqueada. Arrastra para pintar. <b>Mantén presionado 2 segs</b> para borrar.
                                    </div>

                                    <section>
                                        <h2 className="font-bold text-emerald-700 uppercase mb-2">Piezas Tradicionales</h2>
                                        <div className="grid grid-cols-3 gap-2">
                                            <button onClick={() => setActiveTool('asanoha')} className={`flex flex-col items-center p-2 rounded border ${activeTool === 'asanoha' ? 'bg-emerald-100 border-emerald-500 shadow-inner' : 'bg-white hover:bg-gray-50'}`} title="Asa-no-ha">
                                                <span className="text-lg">🌸</span><span className="font-bold text-[9px] mt-1 text-center truncate w-full">Asa-no-ha</span>
                                            </button>
                                            <button onClick={() => setActiveTool('sakura')} className={`flex flex-col items-center p-2 rounded border ${activeTool === 'sakura' ? 'bg-emerald-100 border-emerald-500 shadow-inner' : 'bg-white hover:bg-gray-50'}`} title="Sakura (Cerezo)">
                                                <span className="text-lg">💮</span><span className="font-bold text-[9px] mt-1 text-center truncate w-full">Sakura</span>
                                            </button>
                                            <button onClick={() => setActiveTool('kikko')} className={`flex flex-col items-center p-2 rounded border ${activeTool === 'kikko' ? 'bg-emerald-100 border-emerald-500 shadow-inner' : 'bg-white hover:bg-gray-50'}`} title="Kikko (Tortuga)">
                                                <span className="text-lg">🐢</span><span className="font-bold text-[9px] mt-1 text-center truncate w-full">Kikko</span>
                                            </button>
                                            <button onClick={() => setActiveTool('goma')} className={`flex flex-col items-center p-2 rounded border ${activeTool === 'goma' ? 'bg-emerald-100 border-emerald-500 shadow-inner' : 'bg-white hover:bg-gray-50'}`} title="Goma (Sésamo)">
                                                <span className="text-lg">🌾</span><span className="font-bold text-[9px] mt-1 text-center truncate w-full">Goma</span>
                                            </button>
                                            <button onClick={() => setActiveTool('bishamon')} className={`flex flex-col items-center p-2 rounded border ${activeTool === 'bishamon' ? 'bg-emerald-100 border-emerald-500 shadow-inner' : 'bg-white hover:bg-gray-50'}`} title="Bishamon Kikko">
                                                <span className="text-lg">🛡️</span><span className="font-bold text-[9px] mt-1 text-center truncate w-full">Bishamon</span>
                                            </button>
                                            <button onClick={() => setActiveTool('hexagono')} className={`flex flex-col items-center p-2 rounded border ${activeTool === 'hexagono' ? 'bg-emerald-100 border-emerald-500 shadow-inner' : 'bg-white hover:bg-gray-50'}`} title="Hexágono">
                                                <span className="text-lg">⬡</span><span className="font-bold text-[9px] mt-1 text-center truncate w-full">Hexágono</span>
                                            </button>
                                            <button onClick={() => setActiveTool('estrella')} className={`flex flex-col items-center p-2 rounded border ${activeTool === 'estrella' ? 'bg-emerald-100 border-emerald-500 shadow-inner' : 'bg-white hover:bg-gray-50'}`} title="Estrella Menor">
                                                <span className="text-lg">✡️</span><span className="font-bold text-[9px] mt-1 text-center truncate w-full">Estrella</span>
                                            </button>
                                            <button onClick={() => setActiveTool('pleno')} className={`flex flex-col items-center p-2 rounded border ${activeTool === 'pleno' ? 'bg-emerald-100 border-emerald-500 shadow-inner' : 'bg-white hover:bg-gray-50'}`} title="Triángulo Sólido">
                                                <span className="text-lg">🔺</span><span className="font-bold text-[9px] mt-1 text-center truncate w-full">Pleno</span>
                                            </button>
                                            <button onClick={() => setActiveTool('eraser')} className={`flex flex-col items-center p-2 rounded border ${activeTool === 'eraser' ? 'bg-red-100 border-red-500 shadow-inner' : 'bg-white hover:bg-red-50'}`} title="Borrar">
                                                <span className="text-lg">🧹</span><span className="font-bold text-[9px] mt-1 text-red-700 text-center truncate w-full">Borrar</span>
                                            </button>
                                        </div>
                                    </section>

                                    {activeTool !== 'eraser' && (
                                        <section>
                                            <h2 className="font-bold text-emerald-700 uppercase mb-2">Color</h2>
                                            <div className="grid grid-cols-5 gap-2">
                                                {WOOD_COLORS.map(color => (
                                                    <button 
                                                        key={'tool_'+color.id}
                                                        onClick={() => setActiveColor(color.hex)}
                                                        className={`h-8 rounded border-2 transition-transform ${activeColor === color.hex ? 'border-blue-500 scale-110 shadow-md' : 'border-gray-200 hover:scale-105'}`}
                                                        style={{ backgroundColor: color.hex }}
                                                        title={color.name}
                                                    ></button>
                                                ))}
                                            </div>
                                        </section>
                                    )}

                                    <section>
                                        <h2 className="font-bold text-emerald-700 uppercase mb-2">Ajustes Infill</h2>
                                        <div className="flex gap-2">
                                            <div className="w-1/2">
                                                <label className="text-[10px] text-gray-500 font-bold block mb-1">Grosor (mm)</label>
                                                <input type="number" step="0.1" value={infillThickness} onChange={handleNumberInput(setInfillThickness)} className="w-full border p-1 rounded font-mono" />
                                            </div>
                                            <div className="w-1/2">
                                                <label className="text-[10px] text-gray-500 font-bold block mb-1">Tolerancia (mm)</label>
                                                <input type="number" step="0.05" value={clearance} onChange={handleNumberInput(setClearance)} className="w-full border p-1 rounded font-mono" />
                                            </div>
                                        </div>
                                        <p className="text-[8px] text-gray-400 mt-1">Usa Tolerancia &gt; 0 si vas a exportar piezas sueltas para encastrarlas a presión.</p>
                                    </section>

                                    <div className="pt-2 border-t border-gray-200 flex flex-col gap-2">
                                        <button onClick={fillAllWithPattern} className="w-full bg-white border border-emerald-300 text-emerald-700 font-bold py-1.5 rounded hover:bg-emerald-50 transition-colors">
                                            Rellenar Todo el Lienzo
                                        </button>
                                        <button onClick={clearAllPattern} className="w-full bg-white border border-red-300 text-red-600 font-bold py-1.5 rounded hover:bg-red-50 transition-colors">
                                            Vaciar Lienzo
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* PANEL BOM Y PIEZAS INDIVIDUALES */}
                            <section className="bg-amber-50 rounded border border-amber-200 p-2 mt-4">
                                <h2 className="font-bold text-amber-800 uppercase mb-2">Resumen de Piezas (BOM)</h2>
                                {bomItems.length === 0 ? (
                                    <p className="text-[10px] text-amber-700">Aún no hay piezas pintadas.</p>
