<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Kumiko 3D (Jigumi Real)</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Three.js y utilidades para 3MF y Fusión de Geometría -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
    <!-- fflate es requerido para comprimir el archivo 3MF -->
    <script src="https://unpkg.com/fflate@0.8.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/3MFExporter.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // 1. Cama de Impresión
            const [bedWidth, setBedWidth] = useState(250);
            const [bedHeight, setBedHeight] = useState(250);

            // 2. Medidas del Cuadro 
            const [width, setWidth] = useState(388); 
            const [height, setHeight] = useState(488); 
            
            // 3. Paneles
            const [panelCols, setPanelCols] = useState(2);
            const [panelRows, setPanelRows] = useState(2);
            const [visualGap, setVisualGap] = useState(5);
            const [exportSelection, setExportSelection] = useState('single'); 
            
            // 4. Estados del patrón Jigumi Real
            const [triangleSide, setTriangleSide] = useState(43.5); // Pitch
            const [patternCols, setPatternCols] = useState(8);      // Size A
            const [patternRows, setPatternRows] = useState(12);     // Size B
            const [thickness, setThickness] = useState(3);          // Mitsuke
            const [depth, setDepth] = useState(5);
            const [showBorders, setShowBorders] = useState(true);
            const [isAutoFit, setIsAutoFit] = useState(false); 

            // Modales
            const [showConfigModal, setShowConfigModal] = useState(false);
            const [showInfoModal, setShowInfoModal] = useState(false);
            const [configText, setConfigText] = useState("");

            const mountRef = useRef(null);
            const sceneRef = useRef(null);
            const cameraRef = useRef(null);
            const rendererRef = useRef(null);
            const meshGroupRef = useRef(null);
            const panelsRef = useRef([]);
            const singleMeshRef = useRef(null); 

            // Valores numéricos seguros
            const validWidth = Number(width) || 0;
            const validHeight = Number(height) || 0;
            const validTriangleSide = Number(triangleSide) || 43.5;
            const validPatternCols = Number(patternCols) || 1;
            const validPatternRows = Number(patternRows) || 1;

            const hasValidDimensions = validWidth > 0 && validHeight > 0;

            // Cálculos para Paneles
            const pw = validWidth > 0 ? validWidth / panelCols : 0;
            const ph = validHeight > 0 ? validHeight / panelRows : 0;
            const totalPanels = panelCols * panelRows;
            const exceedsBed = pw > bedWidth || ph > bedHeight;

            // Cálculos de Geometría Jigumi
            const SQRT3 = Math.sqrt(3);
            
            const targetInnerW = showBorders ? Math.max(0, validWidth - thickness * 2) : validWidth;
            const targetInnerH = showBorders ? Math.max(0, validHeight - thickness * 2) : validHeight;

            const cellW = isAutoFit ? (validPatternCols > 0 ? targetInnerW / validPatternCols : 0) : validTriangleSide;
            const cellH = isAutoFit ? (validPatternRows > 0 ? targetInnerH / validPatternRows : 0) : (validTriangleSide * SQRT3 / 2);

            const innerW = validPatternCols * cellW;
            const innerH = validPatternRows * cellH;
            
            const calcFrameX = (validWidth - innerW) / 2;
            const calcFrameY = (validHeight - innerH) / 2;

            // Evaluación de la Magia Kumiko (Tolerancias)
            const currentRatio = cellH > 0 ? (cellW / cellH) : 1.1547;
            const baseAngle = Math.atan2(cellH, cellW / 2) * (180 / Math.PI); // Ángulo de la base
            
            let kumikoStatus = "ideal";
            let statusColor = "text-green-700";
            let statusBg = "bg-green-50";
            let statusBorder = "border-green-200";
            let statusText = "¡Perfecto! Geometría tradicional intacta.";
            let fixSuggestion = "";

            if (currentRatio < 1.04) {
                kumikoStatus = "roto";
                statusColor = "text-red-700";
                statusBg = "bg-red-50";
                statusBorder = "border-red-200";
                statusText = "Geometría Rota. Muy alto/angosto.";
                fixSuggestion = "Resta filas (Size B) o suma columnas (Size A).";
            } else if (currentRatio > 1.26) {
                kumikoStatus = "roto";
                statusColor = "text-red-700";
                statusBg = "bg-red-50";
                statusBorder = "border-red-200";
                statusText = "Geometría Rota. Muy estirado a lo ancho.";
                fixSuggestion = "Suma columnas (Size A) o resta filas (Size B).";
            } else if (currentRatio < 1.10 || currentRatio > 1.20) {
                kumikoStatus = "aceptable";
                statusColor = "text-yellow-700";
                statusBg = "bg-yellow-50";
                statusBorder = "border-yellow-300";
                statusText = "Aceptable. Deformación leve.";
            }

            // Inicializar Three.js
            useEffect(() => {
                const containerWidth = mountRef.current.clientWidth;
                const containerHeight = mountRef.current.clientHeight;

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0xf0f0f0);
                sceneRef.current = scene;

                const camera = new THREE.PerspectiveCamera(45, containerWidth / containerHeight, 0.1, 2000);
                camera.position.set(0, 0, 500);
                cameraRef.current = camera;

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(containerWidth, containerHeight);
                renderer.shadowMap.enabled = true;
                mountRef.current.appendChild(renderer.domElement);
                rendererRef.current = renderer;

                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
                dirLight.position.set(100, 100, 200);
                scene.add(dirLight);

                const meshGroup = new THREE.Group();
                scene.add(meshGroup);
                meshGroupRef.current = meshGroup;

                const animate = () => {
                    requestAnimationFrame(animate);
                    controls.update();
                    renderer.render(scene, camera);
                };
                animate();

                const handleResize = () => {
                    if (mountRef.current && rendererRef.current && cameraRef.current) {
                        const newWidth = mountRef.current.clientWidth;
                        const newHeight = mountRef.current.clientHeight;
                        rendererRef.current.setSize(newWidth, newHeight);
                        cameraRef.current.aspect = newWidth / newHeight;
                        cameraRef.current.updateProjectionMatrix();
                    }
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    mountRef.current.removeChild(renderer.domElement);
                };
            }, []);

            // Generar geometría isométrica
            useEffect(() => {
                if (!meshGroupRef.current) return;

                const group = meshGroupRef.current;
                
                while(group.children.length > 0){ 
                    const child = group.children[0];
                    group.remove(child); 
                    if(child.geometry) child.geometry.dispose();
                    if(child.material) child.material.dispose();
                }
                
                panelsRef.current = [];
                singleMeshRef.current = null;

                if (!hasValidDimensions) return;

                const PXmin = -innerW / 2;
                const PXmax = innerW / 2;
                const PYmin = -innerH / 2;
                const PYmax = innerH / 2;

                const patternBox = { minX: PXmin, maxX: PXmax, minY: PYmin, maxY: PYmax };
                const segments = [];

                function clipSegmentToBox(pA, pB, box) {
                    let x0 = pA.x, y0 = pA.y;
                    let x1 = pB.x, y1 = pB.y;
                    let dx = x1 - x0, dy = y1 - y0;
                    let p = [-dx, dx, -dy, dy];
                    let q = [x0 - box.minX, box.maxX - x0, y0 - box.minY, box.maxY - y0];
                    let t0 = 0.0, t1 = 1.0;

                    for (let i = 0; i < 4; i++) {
                        if (p[i] === 0) {
                            if (q[i] < 0) return null;
                        } else {
                            let t = q[i] / p[i];
                            if (p[i] < 0) {
                                if (t > t1) return null;
                                if (t > t0) t0 = t;
                            } else {
                                if (t < t0) return null;
                                if (t < t1) t1 = t;
                            }
                        }
                    }
                    return {
                        A: new THREE.Vector2(x0 + t0 * dx, y0 + t0 * dy),
                        B: new THREE.Vector2(x0 + t1 * dx, y0 + t1 * dy)
                    };
                }

                let startJ = showBorders ? 0 : 1;
                let endJ = showBorders ? validPatternRows : validPatternRows - 1;
                for (let j = startJ; j <= endJ; j++) {
                    let y = PYmin + j * cellH;
                    segments.push({ A: new THREE.Vector2(PXmin, y), B: new THREE.Vector2(PXmax, y) });
                }

                let kMin60 = -validPatternRows - 1;
                let kMax60 = validPatternCols + 1;
                for (let k = kMin60; k <= kMax60; k++) {
                    let x0 = PXmin + k * cellW;
                    let y0 = PYmin;
                    let x1 = x0 + validPatternRows * (cellW / 2);
                    let y1 = PYmax;
                    let clipped = clipSegmentToBox({x: x0, y: y0}, {x: x1, y: y1}, patternBox);
                    if (clipped) segments.push(clipped);
                }

                let kMinM60 = -1;
                let kMaxM60 = validPatternCols + validPatternRows + 1;
                for (let k = kMinM60; k <= kMaxM60; k++) {
                    let x0 = PXmin + k * cellW;
                    let y0 = PYmin;
                    let x1 = x0 - validPatternRows * (cellW / 2);
                    let y1 = PYmax;
                    let clipped = clipSegmentToBox({x: x0, y: y0}, {x: x1, y: y1}, patternBox);
                    if (clipped) segments.push(clipped);
                }

                for (let py = 0; py < panelRows; py++) {
                    for (let px = 0; px < panelCols; px++) {
                        const panelName = `Panel ${px+1}x${py+1}`;
                        const isEven = (px + py) % 2 === 0;
                        const material = new THREE.MeshLambertMaterial({ color: isEven ? 0xddb870 : 0xcb9f55 });
                        
                        const panelGeometries = [];
                        
                        let cx = -validWidth/2 + pw/2 + px * pw;
                        let cy = -validHeight/2 + ph/2 + py * ph;
                        let panelBox = {
                            minX: cx - pw/2,
                            maxX: cx + pw/2,
                            minY: cy - ph/2,
                            maxY: cy + ph/2
                        };

                        const addSegment = (pA, pB) => {
                            let dx = pB.x - pA.x;
                            let dy = pB.y - pA.y;
                            let length = Math.sqrt(dx*dx + dy*dy);
                            if (length < 0.01) return;
                            let angle = Math.atan2(dy, dx);
                            let midX = (pA.x + pB.x) / 2;
                            let midY = (pA.y + pB.y) / 2;
                            
                            let isHoriz = Math.abs(dy) < 0.01;
                            let curThickness = thickness;

                            if (isHoriz) {
                                if (Math.abs(pA.y - panelBox.maxY) < 0.01) {
                                    curThickness = thickness / 2;
                                    midY -= thickness / 4; 
                                } else if (Math.abs(pA.y - panelBox.minY) < 0.01) {
                                    curThickness = thickness / 2;
                                    midY += thickness / 4; 
                                }
                            }

                            const eps = 0.05;
                            let touchesBorder = (
                                Math.abs(pA.x - panelBox.minX) < eps || Math.abs(pA.x - panelBox.maxX) < eps ||
                                Math.abs(pA.y - panelBox.minY) < eps || Math.abs(pA.y - panelBox.maxY) < eps ||
                                Math.abs(pB.x - panelBox.minX) < eps || Math.abs(pB.x - panelBox.maxX) < eps ||
                                Math.abs(pB.y - panelBox.minY) < eps || Math.abs(pB.y - panelBox.maxY) < eps
                            );
                            
                            let extra = touchesBorder ? thickness * 0.1 : thickness * 1.2;

                            const geo = new THREE.BoxGeometry(length + extra, curThickness, depth);
                            const mat = new THREE.Matrix4();
                            mat.makeRotationZ(angle);
                            mat.setPosition(midX - cx, midY - cy, 0); 
                            geo.applyMatrix4(mat);
                            panelGeometries.push(geo);
                        };

                        segments.forEach(seg => {
                            let clipped = clipSegmentToBox(seg.A, seg.B, panelBox);
                            if (clipped) addSegment(clipped.A, clipped.B);
                        });

                        if (showBorders) {
                            const addRectIfValid = (rect) => {
                                let minX = Math.max(rect.minX, panelBox.minX);
                                let maxX = Math.min(rect.maxX, panelBox.maxX);
                                let minY = Math.max(rect.minY, panelBox.minY);
                                let maxY = Math.min(rect.maxY, panelBox.maxY);

                                if (maxX > minX && maxY > minY) {
                                    let w = maxX - minX;
                                    let h = maxY - minY;
                                    let midX = (minX + maxX) / 2;
                                    let midY = (minY + maxY) / 2;
                                    const geo = new THREE.BoxGeometry(w + 0.05, h + 0.05, depth);
                                    const mat = new THREE.Matrix4();
                                    mat.setPosition(midX - cx, midY - cy, 0);
                                    geo.applyMatrix4(mat);
                                    panelGeometries.push(geo);
                                }
                            };

                            addRectIfValid({ minX: -validWidth/2, maxX: PXmin, minY: -validHeight/2, maxY: validHeight/2 });
                            addRectIfValid({ minX: PXmax, maxX: validWidth/2, minY: -validHeight/2, maxY: validHeight/2 });
                            addRectIfValid({ minX: PXmin, maxX: PXmax, minY: -validHeight/2, maxY: PYmin });
                            addRectIfValid({ minX: PXmin, maxX: PXmax, minY: PYmax, maxY: validHeight/2 });
                        }

                        if (panelGeometries.length > 0) {
                            const mergedGeometry = THREE.BufferGeometryUtils.mergeBufferGeometries(panelGeometries);
                            const mesh = new THREE.Mesh(mergedGeometry, material);
                            
                            const centerVisualX = (px - (panelCols - 1) / 2) * (pw + visualGap);
                            const centerVisualY = (py - (panelRows - 1) / 2) * (ph + visualGap);
                            mesh.position.set(centerVisualX, centerVisualY, 0);
                            mesh.userData = { px, py, name: panelName };
                            
                            group.add(mesh);
                            panelsRef.current.push(mesh);
                        }
                    }
                }

                const singleGeometries = [];
                let fullBox = { minX: -validWidth/2, maxX: validWidth/2, minY: -validHeight/2, maxY: validHeight/2 };

                segments.forEach(seg => {
                    let clipped = clipSegmentToBox(seg.A, seg.B, fullBox);
                    if (clipped) {
                        let dx = clipped.B.x - clipped.A.x;
                        let dy = clipped.B.y - clipped.A.y;
                        let length = Math.sqrt(dx*dx + dy*dy);
                        if (length < 0.01) return;
                        let angle = Math.atan2(dy, dx);
                        let midX = (clipped.A.x + clipped.B.x) / 2;
                        let midY = (clipped.A.y + clipped.B.y) / 2;
                        
                        const eps = 0.05;
                        let touchesBorder = (
                            Math.abs(clipped.A.x - fullBox.minX) < eps || Math.abs(clipped.A.x - fullBox.maxX) < eps ||
                            Math.abs(clipped.A.y - fullBox.minY) < eps || Math.abs(clipped.A.y - fullBox.maxY) < eps ||
                            Math.abs(clipped.B.x - fullBox.minX) < eps || Math.abs(clipped.B.x - fullBox.maxX) < eps ||
                            Math.abs(clipped.B.y - fullBox.minY) < eps || Math.abs(clipped.B.y - fullBox.maxY) < eps
                        );
                        
                        let extra = touchesBorder ? thickness * 0.1 : thickness * 1.2;
                        const geo = new THREE.BoxGeometry(length + extra, thickness, depth);
                        const mat = new THREE.Matrix4();
                        mat.makeRotationZ(angle);
                        mat.setPosition(midX, midY, 0);
                        geo.applyMatrix4(mat);
                        singleGeometries.push(geo);
                    }
                });

                if (showBorders) {
                    const addRectFull = (minX, maxX, minY, maxY) => {
                        if (maxX > minX && maxY > minY) {
                            let w = maxX - minX;
                            let h = maxY - minY;
                            const geo = new THREE.BoxGeometry(w + 0.05, h + 0.05, depth);
                            const mat = new THREE.Matrix4();
                            mat.setPosition((minX + maxX)/2, (minY + maxY)/2, 0);
                            geo.applyMatrix4(mat);
                            singleGeometries.push(geo);
                        }
                    };
                    addRectFull(-validWidth/2, PXmin, -validHeight/2, validHeight/2);
                    addRectFull(PXmax, validWidth/2, -validHeight/2, validHeight/2);
                    addRectFull(PXmin, PXmax, -validHeight/2, PYmin);
                    addRectFull(PXmin, PXmax, PYmax, validHeight/2);
                }

                if (singleGeometries.length > 0) {
                    const mergedGeometry = THREE.BufferGeometryUtils.mergeBufferGeometries(singleGeometries);
                    singleMeshRef.current = new THREE.Mesh(mergedGeometry, new THREE.MeshLambertMaterial({color: 0xcb9f55}));
                }

            }, [validWidth, validHeight, validTriangleSide, validPatternCols, validPatternRows, thickness, depth, panelCols, panelRows, visualGap, pw, ph, showBorders, innerW, innerH, cellW, cellH]);

            const autoCalculatePanels = () => {
                if (validWidth > 0 && validHeight > 0) {
                    setPanelCols(Math.ceil(validWidth / bedWidth));
                    setPanelRows(Math.ceil(validHeight / bedHeight));
                }
            };

            const autoAdjustPattern = () => {
                if (validWidth > 0 && validHeight > 0 && validTriangleSide > 0) {
                    let targetW = validWidth - thickness * 2;
                    let targetH = validHeight - thickness * 2;
                    if (targetW < 0) targetW = validWidth;
                    if (targetH < 0) targetH = validHeight;

                    setPatternCols(Math.floor(targetW / validTriangleSide));
                    setPatternRows(Math.floor(targetH / (validTriangleSide * Math.sqrt(3)/2)));
                }
            };

            const fitPitchToWidth = () => {
                if (validWidth > 0 && validPatternCols > 0) {
                    let newPitch = (validWidth - thickness * 2) / validPatternCols;
                    setTriangleSide(parseFloat(newPitch.toFixed(2)));
                }
            };

            const fitPitchToHeight = () => {
                if (validHeight > 0 && validPatternRows > 0) {
                    let newPitch = (validHeight - thickness * 2) / (validPatternRows * Math.sqrt(3)/2);
                    setTriangleSide(parseFloat(newPitch.toFixed(2)));
                }
            };

            // SISTEMA DE CONFIGURACIÓN
            const handleApplyConfig = () => {
                try {
                    const parsed = JSON.parse(configText);
                    if(parsed.bedWidth) setBedWidth(parsed.bedWidth);
                    if(parsed.bedHeight) setBedHeight(parsed.bedHeight);
                    if(parsed.width) setWidth(parsed.width);
                    if(parsed.height) setHeight(parsed.height);
                    if(parsed.panelCols) setPanelCols(parsed.panelCols);
                    if(parsed.panelRows) setPanelRows(parsed.panelRows);
                    if(parsed.triangleSide) setTriangleSide(parsed.triangleSide);
                    if(parsed.patternCols) setPatternCols(parsed.patternCols);
                    if(parsed.patternRows) setPatternRows(parsed.patternRows);
                    if(parsed.thickness) setThickness(parsed.thickness);
                    if(parsed.depth) setDepth(parsed.depth);
                    if(parsed.showBorders !== undefined) setShowBorders(parsed.showBorders);
                    if(parsed.isAutoFit !== undefined) setIsAutoFit(parsed.isAutoFit);
                    setShowConfigModal(false);
                    alert("¡Configuración aplicada correctamente!");
                } catch (e) {
                    alert("Error: El texto proporcionado no es un código de configuración válido.");
                }
            };

            const copyToClipboard = () => {
                try {
                    const el = document.createElement('textarea');
                    el.value = configText;
                    el.setAttribute('readonly', '');
                    el.style.position = 'absolute';
                    el.style.left = '-9999px';
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    alert("¡Código copiado al portapapeles!");
                } catch (e) {
                    alert("No se pudo copiar automáticamente. Por favor, selecciona el texto y cópialo manualmente.");
                }
            };

            // Exportar a 3MF o STL
            const exportFile = (format) => {
                if (!hasValidDimensions) {
                    alert("Por favor ingresa las medidas del cuadro primero.");
                    return;
                }

                try {
                    let fileStringOrBuffer;
                    let filename;
                    let mimeType;

                    const exportScene = new THREE.Scene();
                    
                    if (exportSelection === 'single') {
                        if (!singleMeshRef.current) {
                            alert("Error: No se pudo generar la malla completa. Revisa las medidas ingresadas.");
                            return;
                        }
                        exportScene.add(singleMeshRef.current.clone());
                        filename = `kumiko_ENTERO_SINCORTES_${validWidth}x${validHeight}.${format}`;
                    } else if (exportSelection === 'all') {
                        if (panelsRef.current.length === 0) {
                            alert("Error: No hay paneles generados para exportar.");
                            return;
                        }
                        panelsRef.current.forEach(p => {
                            const clone = p.clone();
                            const px = p.userData.px;
                            const py = p.userData.py;
                            const trueX = (px - (panelCols - 1) / 2) * pw;
                            const trueY = (py - (panelRows - 1) / 2) * ph;
                            clone.position.set(trueX, trueY, 0);
                            exportScene.add(clone);
                        });
                        filename = `kumiko_multi_paneles_${validWidth}x${validHeight}.${format}`;
                    } else {
                        const panel = panelsRef.current.find(p => p.userData.name === exportSelection);
                        if (panel) {
                            const clone = panel.clone();
                            clone.position.set(0, 0, 0); 
                            exportScene.add(clone);
                            filename = `kumiko_${exportSelection.replace(/ /g, '_')}.${format}`;
                        } else {
                            alert("Error: No se encontró el panel seleccionado.");
                            return;
                        }
                    }

                    if (format === '3mf') {
                        if (typeof THREE['3MFExporter'] === 'undefined') {
                            throw new Error("El exportador 3MF no cargó correctamente. Intenta usar .STL");
                        }
                        const exporter = new THREE['3MFExporter']();
                        fileStringOrBuffer = exporter.parse(exportScene);
                        mimeType = 'application/vnd.ms-3mfdocument';
                    } else {
                        const exporter = new THREE.STLExporter();
                        fileStringOrBuffer = exporter.parse(exportScene);
                        mimeType = 'text/plain';
                    }
                    
                    const blob = new Blob([fileStringOrBuffer], { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.style.display = 'none';
                    link.href = url;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (error) {
                    console.error(error);
                    alert("Error en la exportación: " + error.message);
                }
            };

            const handleNumberInput = (setter) => (e) => {
                const val = e.target.value;
                setter(val === '' ? '' : Number(val));
            };

            return (
                <div className="flex h-full relative">
                    
                    {/* Modal de Configuración */}
                    {showConfigModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-lg shadow-2xl w-full max-w-md">
                                <h2 className="text-xl font-bold mb-2 text-gray-800">Cargar / Guardar Configuración</h2>
                                <p className="text-xs text-gray-500 mb-4">Copia este código para guardarlo, o pega un código anterior para recuperar todas las medidas y ajustes.</p>
                                <textarea
                                    className="w-full h-40 border border-gray-300 p-3 text-xs font-mono rounded bg-gray-50 mb-4 focus:ring-blue-500 focus:border-blue-500"
                                    value={configText}
                                    onChange={(e) => setConfigText(e.target.value)}
                                    placeholder="Pega aquí tu código de configuración..."
                                />
                                <div className="flex gap-2 mb-2">
                                    <button onClick={copyToClipboard} className="w-1/2 bg-gray-100 hover:bg-gray-200 text-gray-800 py-2 rounded text-sm font-semibold transition-colors border border-gray-300 shadow-sm">
                                        📋 Copiar Código
                                    </button>
                                    <button onClick={handleApplyConfig} className="w-1/2 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded text-sm font-semibold transition-colors shadow-sm">
                                        ⚙️ Aplicar Cambios
                                    </button>
                                </div>
                                <button onClick={() => setShowConfigModal(false)} className="w-full text-gray-500 hover:text-gray-800 hover:bg-gray-100 text-sm py-2 mt-2 rounded transition-colors font-medium">
                                    Cancelar
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Modal de Información (Teoría Kumiko) */}
                    {showInfoModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-lg shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4 border-b pb-2">
                                    <h2 className="text-xl font-bold text-gray-800">⛩️ La Matemática del Kumiko</h2>
                                    <button onClick={() => setShowInfoModal(false)} className="text-gray-500 hover:text-red-500 text-xl font-bold">×</button>
                                </div>
                                
                                <div className="space-y-4 text-sm text-gray-700">
                                    <p>El patrón base del Kumiko (el <strong>Jigumi</strong>) se fundamenta estrictamente en <strong>triángulos equiláteros perfectos</strong>. Todos sus ángulos internos deben medir exactamente 60°.</p>
                                    
                                    <h3 className="font-bold text-blue-700 mt-4">📐 La Proporción de Oro (El Ideal)</h3>
                                    <p>En un triángulo equilátero perfecto, la relación matemática entre el Ancho (base) y el Alto nunca es 1 a 1. La altura siempre es un 86.6% del ancho.</p>
                                    <div className="bg-blue-50 p-2 rounded text-center border border-blue-200 font-mono text-blue-800">
                                        Proporción Perfecta = Ancho ÷ Alto ≈ 1.15
                                    </div>

                                    <h3 className="font-bold text-gray-800 mt-4">⚠️ Las Tolerancias (¿Cuándo se rompe la ilusión?)</h3>
                                    <p>Si usas la función <b>"Auto-encajar perfecto"</b>, la aplicación deformará la cuadrícula para rellenar tu cuadro. Fíjate en la Relación mostrada en la app:</p>
                                    <ul className="space-y-2">
                                        <li className="flex items-start gap-2">
                                            <span className="text-xl leading-none">🟢</span>
                                            <div><strong>Invisible (1.10 a 1.20):</strong> Ángulos entre 58° y 62°. Indetectable a simple vista. ¡Excelente!</div>
                                        </li>
                                        <li className="flex items-start gap-2">
                                            <span className="text-xl leading-none">🟡</span>
                                            <div><strong>Aceptable (1.04 a 1.26):</strong> El ojo experto lo notará levemente, pero mantiene la estética general.</div>
                                        </li>
                                        <li className="flex items-start gap-2">
                                            <span className="text-xl leading-none">🔴</span>
                                            <div><strong>Ruptura (&lt; 1.04 o &gt; 1.26):</strong> Deja de verse como Kumiko. Los triángulos son muy puntiagudos o muy achatados. Las piezas de relleno (como Asa-no-ha) se verán ovaladas.</div>
                                        </li>
                                    </ul>

                                    <h3 className="font-bold text-indigo-700 mt-4">🔧 ¿Cómo arreglar un diseño Roto?</h3>
                                    <p>Si el estado está en rojo, necesitas acercar la proporción a 1.15:</p>
                                    <ul className="list-disc pl-5">
                                        <li>Si está muy <strong>ancho/estirado</strong>: Suma <i>Columnas (Size A)</i>.</li>
                                        <li>Si está muy <strong>angosto/puntiagudo</strong>: Suma <i>Filas (Size B)</i>.</li>
                                    </ul>
                                </div>
                                
                                <button onClick={() => setShowInfoModal(false)} className="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 text-sm py-2 mt-6 rounded transition-colors font-medium border border-gray-300">
                                    Entendido
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Panel lateral de controles */}
                    <div className="w-80 bg-white shadow-xl z-10 flex flex-col overflow-y-auto">
                        <div className="p-5 border-b bg-gray-50 flex justify-between items-start">
                            <div>
                                <h1 className="text-xl font-bold text-gray-800">Generador Kumiko</h1>
                                <p className="text-[10px] font-semibold text-gray-500 uppercase mt-1 tracking-wider">Geometría Jigumi / Asa-no-ha</p>
                            </div>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => setShowInfoModal(true)}
                                    className="text-gray-400 hover:text-blue-500 transition-colors"
                                    title="Teoría y Matemática Kumiko"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                                </button>
                                <button 
                                    onClick={() => {
                                        const configObj = {
                                            bedWidth, bedHeight, width, height, panelCols, panelRows,
                                            triangleSide, patternCols, patternRows, thickness, depth,
                                            showBorders, isAutoFit
                                        };
                                        setConfigText(JSON.stringify(configObj, null, 2));
                                        setShowConfigModal(true);
                                    }}
                                    className="text-gray-400 hover:text-blue-600 transition-colors"
                                    title="Cargar o Guardar Configuración"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </div>
                        </div>
                        
                        <div className="p-5 space-y-5 flex-grow">
                            {/* PASO 1: Cama de Impresión */}
                            <div>
                                <h2 className="text-xs font-bold text-blue-600 uppercase mb-2">1. Cama de Impresión</h2>
                                <div className="flex gap-2">
                                    <div className="w-1/2">
                                        <label className="block text-xs text-gray-600">Ancho (X) mm</label>
                                        <input type="number" value={bedWidth} onChange={handleNumberInput(setBedWidth)} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm focus:ring-blue-500 focus:border-blue-500" />
                                    </div>
                                    <div className="w-1/2">
                                        <label className="block text-xs text-gray-600">Alto (Y) mm</label>
                                        <input type="number" value={bedHeight} onChange={handleNumberInput(setBedHeight)} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm focus:ring-blue-500 focus:border-blue-500" />
                                    </div>
                                </div>
                            </div>

                            <hr />

                            {/* PASO 2: Medidas del Cuadro */}
                            <div>
                                <h2 className="text-xs font-bold text-blue-600 uppercase mb-2">2. Medidas Interiores Cuadro</h2>
                                <div className="flex gap-2">
                                    <div className="w-1/2">
                                        <label className="block text-xs text-gray-600">Ancho (mm)</label>
                                        <input type="number" placeholder="Ej: 388" value={width} onChange={handleNumberInput(setWidth)} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm focus:ring-blue-500 focus:border-blue-500" />
                                    </div>
                                    <div className="w-1/2">
                                        <label className="block text-xs text-gray-600">Alto (mm)</label>
                                        <input type="number" placeholder="Ej: 488" value={height} onChange={handleNumberInput(setHeight)} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm focus:ring-blue-500 focus:border-blue-500" />
                                    </div>
                                </div>
                                <button 
                                    onClick={autoCalculatePanels}
                                    disabled={!hasValidDimensions}
                                    className={`mt-3 w-full font-semibold py-2 px-4 rounded text-xs transition-colors border ${hasValidDimensions ? 'bg-indigo-100 hover:bg-indigo-200 text-indigo-800 border-indigo-200' : 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed'}`}
                                >
                                    ✨ Dividir en Camas Automáticamente
                                </button>
                            </div>

                            <hr />

                            {/* PASO 3: División en Planchas */}
                            <div className={!hasValidDimensions ? "opacity-50 pointer-events-none" : ""}>
                                <h2 className="text-xs font-bold text-blue-600 uppercase mb-2">3. Configuración de Planchas</h2>
                                
                                {hasValidDimensions && (
                                    <div className={`mb-3 p-3 rounded text-xs border ${exceedsBed ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-800 border-green-200'}`}>
                                        <div className="font-bold mb-1">Resultado de divisiones:</div>
                                        <div>Cantidad: <b>{totalPanels} plancha(s)</b> ({panelCols} col x {panelRows} fil)</div>
                                        <div>Tamaño de cada una: <br/><b>{pw.toFixed(1)} x {ph.toFixed(1)} mm</b></div>
                                        {exceedsBed && (
                                            <div className="mt-1 text-red-600 font-semibold">⚠️ Supera la cama de impresión.</div>
                                        )}
                                    </div>
                                )}

                                <div className="flex gap-2">
                                    <div className="w-1/2">
                                        <label className="block text-xs text-gray-600">Columnas</label>
                                        <input type="number" min="1" value={panelCols} onChange={e => setPanelCols(Math.max(1, Number(e.target.value)))} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm" />
                                    </div>
                                    <div className="w-1/2">
                                        <label className="block text-xs text-gray-600">Filas</label>
                                        <input type="number" min="1" value={panelRows} onChange={e => setPanelRows(Math.max(1, Number(e.target.value)))} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm" />
                                    </div>
                                </div>
                            </div>

                            <hr />
                            
                            {/* PASO 4: Patrón */}
                            <div className={!hasValidDimensions ? "opacity-50 pointer-events-none" : ""}>
                                <h2 className="text-xs font-bold text-blue-600 uppercase mb-2">4. Ajuste Matemático (Jigumi)</h2>
                                
                                <div className="mb-3">
                                    <label className="flex items-center space-x-2 cursor-pointer bg-gray-50 p-2 border rounded hover:bg-gray-100">
                                        <input type="checkbox" checked={showBorders} onChange={(e) => setShowBorders(e.target.checked)} className="rounded text-blue-600 focus:ring-blue-500 h-4 w-4" />
                                        <span className="text-sm font-medium text-gray-700">Marco perimetral sólido</span>
                                    </label>
                                </div>

                                <div className="mb-3">
                                    <label className="flex items-start space-x-2 cursor-pointer bg-blue-50 p-2 border border-blue-200 rounded hover:bg-blue-100">
                                        <input type="checkbox" checked={isAutoFit} onChange={(e) => setIsAutoFit(e.target.checked)} className="rounded mt-0.5 text-blue-600 focus:ring-blue-500 h-4 w-4" />
                                        <div>
                                            <span className="block text-sm font-bold text-blue-800 leading-tight">Auto-encajar perfecto</span>
                                            <span className="block text-[10px] text-blue-600 leading-tight mt-1">Modifica matemáticamente el ángulo de los triángulos para que llenen todo el espacio exacto (funciona con o sin marco).</span>
                                        </div>
                                    </label>
                                </div>

                                {!isAutoFit && (
                                    <div className="mb-3">
                                        <label className="block text-xs font-bold text-gray-700">Lado del Triángulo (S/Pitch)</label>
                                        <div className="flex items-center gap-2">
                                            <input type="number" step="0.5" value={triangleSide} onChange={handleNumberInput(setTriangleSide)} className="mt-1 block w-1/2 border border-gray-300 rounded shadow-sm p-1.5 text-sm font-bold text-blue-700" />
                                            <span className="text-sm text-gray-500">mm</span>
                                        </div>
                                    </div>
                                )}

                                <div className="flex gap-2 mb-2">
                                    <div className="w-1/2">
                                        <label className="block text-xs font-bold text-gray-700">Columnas (Size A)</label>
                                        <input type="number" value={patternCols} onChange={handleNumberInput(setPatternCols)} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm" />
                                    </div>
                                    <div className="w-1/2">
                                        <label className="block text-xs font-bold text-gray-700">Filas (Size B)</label>
                                        <input type="number" value={patternRows} onChange={handleNumberInput(setPatternRows)} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm" />
                                    </div>
                                </div>

                                <button 
                                    onClick={autoAdjustPattern}
                                    className="mb-2 w-full font-semibold py-1.5 px-3 rounded text-[11px] transition-colors bg-gray-200 hover:bg-gray-300 text-gray-800 border border-gray-300"
                                >
                                    ⚖️ 1. Auto-Calcular Cantidades
                                </button>
                                
                                {!isAutoFit && (
                                    <div className="flex gap-2 mb-3">
                                        <button 
                                            onClick={fitPitchToWidth}
                                            className="w-1/2 font-semibold py-1 px-2 rounded text-[10px] transition-colors bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200"
                                        >
                                            ↔️ Ajustar al Ancho
                                        </button>
                                        <button 
                                            onClick={fitPitchToHeight}
                                            className="w-1/2 font-semibold py-1 px-2 rounded text-[10px] transition-colors bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200"
                                        >
                                            ↕️ Ajustar al Alto
                                        </button>
                                    </div>
                                )}

                                {hasValidDimensions && (
                                    <div className="mb-4 p-2 bg-slate-50 border border-slate-200 rounded shadow-inner text-xs">
                                        <div className="font-bold text-slate-700 mb-1 border-b pb-1">Geometría Final:</div>
                                        <div className="flex justify-between mt-1"><span>Ancho del patrón:</span> <b>{innerW.toFixed(1)} mm</b></div>
                                        <div className="flex justify-between"><span>Alto del patrón:</span> <b>{innerH.toFixed(1)} mm</b></div>
                                        
                                        <div className="flex justify-between mt-1 pt-1 border-t border-slate-200 text-indigo-700">
                                            <span title="Incluye los triángulos cortados a la mitad en los bordes">Total de triángulos (Píxeles):</span> 
                                            <b className="text-[13px]">{validPatternCols * validPatternRows * 2}</b>
                                        </div>

                                        <div className="mt-2 bg-white border border-gray-200 p-1.5 rounded">
                                            <div className="flex justify-between text-[11px]">
                                                <span className="text-gray-500">Relación (Ancho/Alto):</span> 
                                                <span className="font-mono font-bold text-gray-700">{currentRatio.toFixed(2)} <span className="text-[9px] text-gray-400 font-normal">(Ideal: 1.15)</span></span>
                                            </div>
                                            <div className="flex justify-between text-[11px] mt-0.5">
                                                <span className="text-gray-500">Ángulo de la base:</span> 
                                                <span className="font-mono font-bold text-gray-700">{baseAngle.toFixed(1)}° <span className="text-[9px] text-gray-400 font-normal">(Ideal: 60°)</span></span>
                                            </div>
                                        </div>

                                        {isAutoFit && (
                                            <div className={`mt-2 text-[10px] p-1.5 rounded font-medium border ${statusBg} ${statusColor} ${statusBorder}`}>
                                                <b>Estado:</b> {statusText}
                                                {fixSuggestion && <div className="mt-0.5 opacity-80">{fixSuggestion}</div>}
                                            </div>
                                        )}

                                        <div className="mt-2 text-[10px] text-gray-500 uppercase tracking-wide">Márgenes (Frame Width)</div>
                                        <div className={`flex justify-between font-bold ${calcFrameX < 0 ? 'text-red-600' : 'text-blue-600'}`}>
                                            <span>Borde lateral (X):</span> <span>{calcFrameX.toFixed(1)} mm</span>
                                        </div>
                                        <div className={`flex justify-between font-bold ${calcFrameY < 0 ? 'text-red-600' : 'text-blue-600'}`}>
                                            <span>Borde superior (Y):</span> <span>{calcFrameY.toFixed(1)} mm</span>
                                        </div>
                                        {(calcFrameX < 0 || calcFrameY < 0) && (
                                            <div className="mt-2 text-red-500 font-bold bg-red-50 p-1 rounded">⚠️ El patrón es más grande que el cuadro. Se recortará.</div>
                                        )}
                                    </div>
                                )}

                                <hr className="my-3"/>

                                <div className="flex gap-2 mb-2">
                                    <div className="w-1/2">
                                        <label className="block text-xs text-gray-600">Grosor (Mitsuke)</label>
                                        <input type="number" step="0.5" value={thickness} onChange={handleNumberInput(setThickness)} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm" />
                                    </div>
                                    <div className="w-1/2">
                                        <label className="block text-xs text-gray-600">Altura Z (3D)</label>
                                        <input type="number" step="1" value={depth} onChange={handleNumberInput(setDepth)} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm" />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs text-gray-600">Ver Separación de Camas</label>
                                    <p className="text-[9px] text-gray-400 mb-1 leading-tight">(100% visual. El archivo 3D se exporta perfectamente unido).</p>
                                    <input type="range" min="0" max="20" value={visualGap} onChange={e => setVisualGap(Number(e.target.value))} className="w-full h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer" />
                                </div>
                            </div>
                        </div>

                        <div className="p-5 border-t bg-gray-50">
                            <label className="block text-xs font-medium text-gray-700 mb-1">Exportar pieza:</label>
                            <select 
                                value={exportSelection} 
                                onChange={e => setExportSelection(e.target.value)}
                                disabled={!hasValidDimensions}
                                className="block w-full border border-gray-300 rounded shadow-sm p-2 mb-2 text-sm focus:ring-blue-500 font-semibold"
                            >
                                <option value="single">⭐️ Objeto Entero (1 pieza sin cortes)</option>
                                <option value="all">Modelo Completo (Todas las planchas)</option>
                                {hasValidDimensions && Array.from({ length: panelCols }).flatMap((_, x) => 
                                    Array.from({ length: panelRows }).map((_, y) => (
                                        <option key={`${x}-${y}`} value={`Panel ${x+1}x${y+1}`}>
                                            Panel {x+1}x{y+1} (Listo para laminar)
                                        </option>
                                    ))
                                )}
                            </select>

                            <div className="flex gap-2">
                                <button 
                                    onClick={() => exportFile('3mf')}
                                    disabled={!hasValidDimensions}
                                    className={`w-2/3 text-white font-bold py-2 px-2 rounded shadow flex justify-center items-center gap-1 text-sm ${!hasValidDimensions ? 'bg-gray-400 cursor-not-allowed' : (exceedsBed && exportSelection !== 'all' && exportSelection !== 'single' ? 'bg-red-500 hover:bg-red-600' : 'bg-green-600 hover:bg-green-700')}`}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                    Exportar .3MF
                                </button>
                                <button 
                                    onClick={() => exportFile('stl')}
                                    disabled={!hasValidDimensions}
                                    className={`w-1/3 text-white font-bold py-2 px-2 rounded shadow flex justify-center items-center gap-1 text-sm ${!hasValidDimensions ? 'bg-gray-400 cursor-not-allowed' : (exceedsBed && exportSelection !== 'all' && exportSelection !== 'single' ? 'bg-red-500 hover:bg-red-600' : 'bg-blue-600 hover:bg-blue-700')}`}
                                >
                                    .STL
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Contenedor Three.js */}
                    <div className="flex-grow relative bg-[#e5e7eb] cursor-move flex items-center justify-center" ref={mountRef}>
                        
                        {!hasValidDimensions && (
                            <div className="absolute z-10 text-center text-gray-500 select-none">
                                <svg className="mx-auto h-12 w-12 text-gray-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                                </svg>
                                <p className="text-lg font-medium">Ingresa las medidas interiores de tu cuadro</p>
                                <p className="text-sm">El modelo 3D aparecerá aquí para que lo visualices.</p>
                            </div>
                        )}

                        {hasValidDimensions && (
                            <div className="absolute top-4 left-4 bg-white/80 p-2 rounded shadow text-xs pointer-events-none z-10 text-gray-600 flex items-center gap-2">
                                <span>🖱️ Click Izquierdo: Rotar</span>
                                <span className="border-l border-gray-300 h-3"></span>
                                <span>Rueda: Zoom</span>
                                <span className="border-l border-gray-300 h-3"></span>
                                <span>Click Derecho: Mover</span>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
