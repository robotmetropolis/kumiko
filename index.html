<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Kumiko 3D</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Three.js para 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // Estados para la cama de impresión (Primero)
            const [bedWidth, setBedWidth] = useState(220);
            const [bedHeight, setBedHeight] = useState(220);

            // Estados para las medidas del cuadro (Vacíos al inicio)
            const [width, setWidth] = useState(""); 
            const [height, setHeight] = useState(""); 
            
            // Nuevos estados para paneles y diseño
            const [panelCols, setPanelCols] = useState(1);
            const [panelRows, setPanelRows] = useState(1);
            const [visualGap, setVisualGap] = useState(5);
            const [exportSelection, setExportSelection] = useState('all');
            
            // Estados del patrón
            const [gridSize, setGridSize] = useState(25);
            const [thickness, setThickness] = useState(2);
            const [depth, setDepth] = useState(5);
            const [showBorders, setShowBorders] = useState(true); // NUEVO: Mostrar recuadro

            const mountRef = useRef(null);
            const sceneRef = useRef(null);
            const cameraRef = useRef(null);
            const rendererRef = useRef(null);
            const meshGroupRef = useRef(null);
            const panelsRef = useRef([]);

            // Valores numéricos seguros
            const validWidth = Number(width) || 0;
            const validHeight = Number(height) || 0;

            // Cálculos derivados
            const pw = validWidth > 0 ? validWidth / panelCols : 0;
            const ph = validHeight > 0 ? validHeight / panelRows : 0;
            const totalPanels = panelCols * panelRows;
            const exceedsBed = pw > bedWidth || ph > bedHeight;
            const hasValidDimensions = validWidth > 0 && validHeight > 0;

            // Cálculos de cuadrícula exactos expuestos a la UI
            const colsPerPanel = hasValidDimensions ? Math.max(1, Math.round(pw / gridSize)) : 1;
            const rowsPerPanel = hasValidDimensions ? Math.max(1, Math.round(ph / gridSize)) : 1;
            const actualCellW = hasValidDimensions ? pw / colsPerPanel : 0;
            const actualCellH = hasValidDimensions ? ph / rowsPerPanel : 0;

            // Inicializar Three.js
            useEffect(() => {
                const containerWidth = mountRef.current.clientWidth;
                const containerHeight = mountRef.current.clientHeight;

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0xf0f0f0);
                sceneRef.current = scene;

                const camera = new THREE.PerspectiveCamera(45, containerWidth / containerHeight, 0.1, 2000);
                camera.position.set(0, 0, 400);
                cameraRef.current = camera;

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(containerWidth, containerHeight);
                renderer.shadowMap.enabled = true;
                mountRef.current.appendChild(renderer.domElement);
                rendererRef.current = renderer;

                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
                dirLight.position.set(100, 100, 200);
                scene.add(dirLight);

                const meshGroup = new THREE.Group();
                scene.add(meshGroup);
                meshGroupRef.current = meshGroup;

                const animate = () => {
                    requestAnimationFrame(animate);
                    controls.update();
                    renderer.render(scene, camera);
                };
                animate();

                const handleResize = () => {
                    if (mountRef.current && rendererRef.current && cameraRef.current) {
                        const newWidth = mountRef.current.clientWidth;
                        const newHeight = mountRef.current.clientHeight;
                        rendererRef.current.setSize(newWidth, newHeight);
                        cameraRef.current.aspect = newWidth / newHeight;
                        cameraRef.current.updateProjectionMatrix();
                    }
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    mountRef.current.removeChild(renderer.domElement);
                };
            }, []);

            // Generar geometría
            useEffect(() => {
                if (!meshGroupRef.current) return;

                const group = meshGroupRef.current;
                
                // Limpiar siempre la geometría anterior
                while(group.children.length > 0){ 
                    const child = group.children[0];
                    group.remove(child); 
                    if(child.type === 'Group') {
                        child.children.forEach(c => {
                            if(c.geometry) c.geometry.dispose();
                            if(c.material) c.material.dispose();
                        });
                    } else {
                        if(child.geometry) child.geometry.dispose();
                        if(child.material) child.material.dispose();
                    }
                }
                
                panelsRef.current = [];

                // Si no hay medidas válidas, no dibujar nada
                if (!hasValidDimensions) return;

                const diagLength = Math.sqrt(actualCellW*actualCellW + actualCellH*actualCellH) - thickness*0.8; 
                const angle = Math.atan2(actualCellH, actualCellW);

                for (let px = 0; px < panelCols; px++) {
                    for (let py = 0; py < panelRows; py++) {
                        const panelGroup = new THREE.Group();
                        const panelName = `Panel ${px+1}x${py+1}`;
                        panelGroup.userData = { px, py, name: panelName };

                        const isEven = (px + py) % 2 === 0;
                        const material = new THREE.MeshLambertMaterial({ color: isEven ? 0xe6c280 : 0xd4ae6a });

                        const createBarLocal = (w, h, d, x, y, rotationZ = 0) => {
                            const geometry = new THREE.BoxGeometry(w, h, d);
                            const mesh = new THREE.Mesh(geometry, material);
                            mesh.position.set(x, y, 0);
                            mesh.rotation.z = rotationZ;
                            panelGroup.add(mesh);
                        };

                        // 1. Marco del panel (Opcional según showBorders)
                        if (showBorders) {
                            const tTop = py === panelRows - 1 ? thickness : thickness / 2;
                            const tBot = py === 0 ? thickness : thickness / 2;
                            const tLeft = px === 0 ? thickness : thickness / 2;
                            const tRight = px === panelCols - 1 ? thickness : thickness / 2;

                            createBarLocal(pw, tTop, depth, 0, ph/2 - tTop/2); // Arriba
                            createBarLocal(pw, tBot, depth, 0, -ph/2 + tBot/2); // Abajo
                            
                            const innerH = ph - tTop - tBot;
                            createBarLocal(tLeft, innerH, depth, -pw/2 + tLeft/2, (tBot - tTop)/2); // Izquierda
                            createBarLocal(tRight, innerH, depth, pw/2 - tRight/2, (tBot - tTop)/2); // Derecha
                        }

                        // 2. Cuadrícula interior
                        for (let i = (showBorders ? 1 : 0); i <= (showBorders ? colsPerPanel - 1 : colsPerPanel); i++) {
                            // Evitar duplicar los bordes si showBorders es falso pero estamos en los extremos
                            if (!showBorders && (i === 0 || i === colsPerPanel)) continue;
                            const x = -pw/2 + i * actualCellW;
                            createBarLocal(thickness, ph, depth, x, 0);
                        }
                        for (let j = (showBorders ? 1 : 0); j <= (showBorders ? rowsPerPanel - 1 : rowsPerPanel); j++) {
                            if (!showBorders && (j === 0 || j === rowsPerPanel)) continue;
                            const y = -ph/2 + j * actualCellH;
                            createBarLocal(pw, thickness, depth, 0, y);
                        }

                        // 3. Diagonales
                        for (let i = 0; i < colsPerPanel; i++) {
                            for (let j = 0; j < rowsPerPanel; j++) {
                                const centerX = -pw/2 + i * actualCellW + actualCellW / 2;
                                const centerY = -ph/2 + j * actualCellH + actualCellH / 2;
                                
                                createBarLocal(diagLength, thickness, depth, centerX, centerY, angle);
                                createBarLocal(diagLength, thickness, depth, centerX, centerY, -angle);
                            }
                        }

                        const centerX = (px - (panelCols - 1) / 2) * (pw + visualGap);
                        const centerY = (py - (panelRows - 1) / 2) * (ph + visualGap);
                        panelGroup.position.set(centerX, centerY, 0);

                        group.add(panelGroup);
                        panelsRef.current.push(panelGroup);
                    }
                }

            }, [validWidth, validHeight, gridSize, thickness, depth, panelCols, panelRows, visualGap, pw, ph, showBorders, actualCellW, actualCellH, colsPerPanel, rowsPerPanel]);

            const autoCalculatePanels = () => {
                if (validWidth > 0 && validHeight > 0) {
                    setPanelCols(Math.ceil(validWidth / bedWidth));
                    setPanelRows(Math.ceil(validHeight / bedHeight));
                }
            };

            // Exportar a STL
            const exportSTL = () => {
                if (!hasValidDimensions) {
                    alert("Por favor ingresa las medidas del cuadro primero.");
                    return;
                }

                const exporter = new THREE.STLExporter();
                let stlString;
                let filename;

                if (exportSelection === 'all') {
                    stlString = exporter.parse(sceneRef.current);
                    filename = `kumiko_completo_${validWidth}x${validHeight}.stl`;
                } else {
                    const panel = panelsRef.current.find(p => p.userData.name === exportSelection);
                    if (panel) {
                        const originalPos = panel.position.clone();
                        panel.position.set(0, 0, 0);
                        panel.updateMatrixWorld(true);
                        
                        stlString = exporter.parse(panel);
                        filename = `kumiko_${exportSelection.replace(/ /g, '_')}.stl`;
                        
                        panel.position.copy(originalPos);
                        panel.updateMatrixWorld(true);
                    } else {
                        return;
                    }
                }
                
                const blob = new Blob([stlString], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.style.display = 'none';
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleNumberInput = (setter) => (e) => {
                const val = e.target.value;
                setter(val === '' ? '' : Number(val));
            };

            return (
                <div className="flex h-full">
                    {/* Panel lateral de controles */}
                    <div className="w-80 bg-white shadow-xl z-10 flex flex-col overflow-y-auto">
                        <div className="p-5 border-b bg-gray-50">
                            <h1 className="text-xl font-bold text-gray-800">Generador Kumiko 3D</h1>
                        </div>
                        
                        <div className="p-5 space-y-5 flex-grow">
                            
                            {/* PASO 1: Cama de Impresión */}
                            <div>
                                <h2 className="text-xs font-bold text-blue-600 uppercase mb-2">1. Cama de Impresión</h2>
                                <div className="flex gap-2">
                                    <div className="w-1/2">
                                        <label className="block text-xs text-gray-600">Ancho (X) mm</label>
                                        <input type="number" value={bedWidth} onChange={handleNumberInput(setBedWidth)} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm focus:ring-blue-500 focus:border-blue-500" />
                                    </div>
                                    <div className="w-1/2">
                                        <label className="block text-xs text-gray-600">Alto (Y) mm</label>
                                        <input type="number" value={bedHeight} onChange={handleNumberInput(setBedHeight)} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm focus:ring-blue-500 focus:border-blue-500" />
                                    </div>
                                </div>
                            </div>

                            <hr />

                            {/* PASO 2: Medidas del Cuadro */}
                            <div>
                                <h2 className="text-xs font-bold text-blue-600 uppercase mb-2">2. Medidas Interiores Cuadro</h2>
                                <div className="flex gap-2">
                                    <div className="w-1/2">
                                        <label className="block text-xs text-gray-600">Ancho (mm)</label>
                                        <input type="number" placeholder="Ej: 300" value={width} onChange={handleNumberInput(setWidth)} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm focus:ring-blue-500 focus:border-blue-500" />
                                    </div>
                                    <div className="w-1/2">
                                        <label className="block text-xs text-gray-600">Alto (mm)</label>
                                        <input type="number" placeholder="Ej: 400" value={height} onChange={handleNumberInput(setHeight)} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm focus:ring-blue-500 focus:border-blue-500" />
                                    </div>
                                </div>
                                <button 
                                    onClick={autoCalculatePanels}
                                    disabled={!hasValidDimensions}
                                    className={`mt-3 w-full font-semibold py-2 px-4 rounded text-xs transition-colors border ${hasValidDimensions ? 'bg-indigo-100 hover:bg-indigo-200 text-indigo-800 border-indigo-200' : 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed'}`}
                                >
                                    ✨ Auto-Calcular Planchas
                                </button>
                            </div>

                            <hr />

                            {/* PASO 3: División en Planchas e Info */}
                            <div className={!hasValidDimensions ? "opacity-50 pointer-events-none" : ""}>
                                <h2 className="text-xs font-bold text-blue-600 uppercase mb-2">3. Configuración de Planchas</h2>
                                
                                {/* CAJA DE INFORMACIÓN DE PLANCHAS */}
                                {hasValidDimensions && (
                                    <div className={`mb-3 p-3 rounded text-xs border ${exceedsBed ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-800 border-green-200'}`}>
                                        <div className="font-bold mb-1">Resultado de divisiones:</div>
                                        <div>Cantidad: <b>{totalPanels} plancha(s)</b> ({panelCols} col x {panelRows} fil)</div>
                                        <div>Tamaño de cada una: <br/><b>{pw.toFixed(1)} x {ph.toFixed(1)} mm</b></div>
                                        {exceedsBed && (
                                            <div className="mt-1 text-red-600 font-semibold">⚠️ Supera la cama de impresión.</div>
                                        )}
                                    </div>
                                )}

                                <div className="flex gap-2">
                                    <div className="w-1/2">
                                        <label className="block text-xs text-gray-600">Columnas</label>
                                        <input type="number" min="1" value={panelCols} onChange={e => setPanelCols(Math.max(1, Number(e.target.value)))} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm" />
                                    </div>
                                    <div className="w-1/2">
                                        <label className="block text-xs text-gray-600">Filas</label>
                                        <input type="number" min="1" value={panelRows} onChange={e => setPanelRows(Math.max(1, Number(e.target.value)))} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm" />
                                    </div>
                                </div>
                            </div>

                            <hr />
                            
                            {/* PASO 4: Patrón */}
                            <div className={!hasValidDimensions ? "opacity-50 pointer-events-none" : ""}>
                                <h2 className="text-xs font-bold text-blue-600 uppercase mb-2">4. Diseño del Patrón</h2>
                                
                                <div className="mb-3">
                                    <label className="flex items-center space-x-2 cursor-pointer bg-gray-50 p-2 border rounded hover:bg-gray-100">
                                        <input type="checkbox" checked={showBorders} onChange={(e) => setShowBorders(e.target.checked)} className="rounded text-blue-600 focus:ring-blue-500 h-4 w-4" />
                                        <span className="text-sm font-medium text-gray-700">Marco perimetral sólido</span>
                                    </label>
                                </div>

                                <div className="mb-3">
                                    <label className="block text-xs text-gray-600">Tamaño aprox. celda (mm)</label>
                                    <input type="range" min="15" max="100" value={gridSize} onChange={e => setGridSize(Number(e.target.value))} className="w-full" />
                                    {hasValidDimensions && (
                                        <div className="mt-1 p-2 bg-blue-50 border border-blue-100 rounded text-xs text-blue-800 shadow-sm">
                                            <span>Tamaño exacto de la celda: <b>{actualCellW.toFixed(1)} x {actualCellH.toFixed(1)} mm</b></span>
                                            <p className="text-[10px] text-gray-500 mt-1 leading-tight">
                                                (El tamaño de los triángulos no cambia al ocultar el marco para asegurar que las puntas encajen siempre en los {pw.toFixed(1)}x{ph.toFixed(1)}mm de la plancha)
                                            </p>
                                        </div>
                                    )}
                                </div>

                                <div className="flex gap-2 mb-2">
                                    <div className="w-1/2">
                                        <label className="block text-xs text-gray-600">Grosor (mm)</label>
                                        <input type="number" step="0.5" value={thickness} onChange={handleNumberInput(setThickness)} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm" />
                                    </div>
                                    <div className="w-1/2">
                                        <label className="block text-xs text-gray-600">Altura Z (mm)</label>
                                        <input type="number" step="1" value={depth} onChange={handleNumberInput(setDepth)} className="mt-1 block w-full border border-gray-300 rounded shadow-sm p-1.5 text-sm" />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs text-gray-600">Visualizar Separación (Solo 3D)</label>
                                    <input type="range" min="0" max="20" value={visualGap} onChange={e => setVisualGap(Number(e.target.value))} className="w-full h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer" />
                                </div>
                            </div>
                        </div>

                        <div className="p-5 border-t bg-gray-50">
                            <label className="block text-xs font-medium text-gray-700 mb-1">Exportar pieza:</label>
                            <select 
                                value={exportSelection} 
                                onChange={e => setExportSelection(e.target.value)}
                                disabled={!hasValidDimensions}
                                className="block w-full border border-gray-300 rounded shadow-sm p-2 mb-3 text-sm focus:ring-blue-500"
                            >
                                <option value="all">Modelo Completo</option>
                                {hasValidDimensions && Array.from({ length: panelCols }).flatMap((_, x) => 
                                    Array.from({ length: panelRows }).map((_, y) => (
                                        <option key={`${x}-${y}`} value={`Panel ${x+1}x${y+1}`}>
                                            Panel {x+1}x{y+1} (Listo para laminar)
                                        </option>
                                    ))
                                )}
                            </select>

                            <button 
                                onClick={exportSTL}
                                disabled={!hasValidDimensions}
                                className={`w-full text-white font-bold py-3 px-4 rounded shadow-md flex justify-center items-center gap-2 ${!hasValidDimensions ? 'bg-gray-400 cursor-not-allowed' : (exceedsBed && exportSelection !== 'all' ? 'bg-red-500 hover:bg-red-600' : 'bg-blue-600 hover:bg-blue-700')}`}
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                Exportar .STL
                            </button>
                        </div>
                    </div>

                    {/* Contenedor Three.js */}
                    <div className="flex-grow relative bg-[#e5e7eb] cursor-move flex items-center justify-center" ref={mountRef}>
                        
                        {!hasValidDimensions && (
                            <div className="absolute z-10 text-center text-gray-500 select-none">
                                <svg className="mx-auto h-12 w-12 text-gray-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                                </svg>
                                <p className="text-lg font-medium">Ingresa las medidas interiores de tu cuadro</p>
                                <p className="text-sm">El modelo 3D aparecerá aquí para que lo visualices.</p>
                            </div>
                        )}

                        {hasValidDimensions && (
                            <div className="absolute top-4 left-4 bg-white/80 p-2 rounded shadow text-xs pointer-events-none z-10 text-gray-600">
                                🖱️ Click Izquierdo: Rotar | Rueda: Zoom | Click Derecho: Mover
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
