                                ) : (
                                    <div className="space-y-1">
                                        {bomItems.map((item, idx) => {
                                            const colorName = WOOD_COLORS.find(c => c.hex === item.color)?.name || 'Color';
                                            return (
                                                <div key={idx} className="flex items-center justify-between bg-white p-1 rounded border border-amber-100 shadow-sm text-[10px]">
                                                    <div className="flex items-center gap-1.5">
                                                        <div className="w-3 h-3 rounded-full border border-gray-300 shadow-inner" style={{backgroundColor: item.color}}></div>
                                                        <span className="font-bold capitalize">{item.type}</span>
                                                        <span className="text-gray-500">x{item.count}</span>
                                                    </div>
                                                    <button 
                                                        onClick={() => exportSingleTool(item.type, item.color)}
                                                        className="text-amber-600 hover:text-amber-800 font-bold px-1.5 py-0.5 rounded hover:bg-amber-100 transition-colors"
                                                        title="Descargar STL suelto"
                                                    >
                                                        ↓ STL
                                                    </button>
                                                </div>
                                            )
                                        })}
                                        <p className="text-[9px] text-amber-700 mt-2 leading-tight">Las piezas sueltas ahora aplican matemática de corte por polígonos. Encajarán perfectas en tu Jigumi sin importar si los ángulos no son exactamente 60°.</p>
                                    </div>
                                )}
                            </section>

                        </div>

                        <div className="p-4 border-t bg-gray-50 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
                            <label className="flex items-center gap-2 mb-3 text-[10px] font-bold text-gray-700 cursor-pointer bg-white p-2 rounded border">
                                <input type="checkbox" checked={exportBase} onChange={e => setExportBase(e.target.checked)} className="accent-blue-600 h-4 w-4" />
                                <span>Incluir Estructura Base (Jigumi)<br/><span className="text-gray-400 font-normal">Destilda para exportar SOLO las piezas.</span></span>
                            </label>
                            
                            <select value={exportSelection} onChange={e => setExportSelection(e.target.value)} className="w-full border p-2 rounded mb-2 font-bold bg-white text-blue-900 border-blue-200">
                                <option value="single">⭐️ Modelo Entero</option>
                                <option value="all">Múltiples STL (Cortes ZIP)</option>
                                {panelsRef.current.map(p => <option key={p.userData.name} value={p.userData.name}>{p.userData.name}</option>)}
                            </select>
                            
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => exportFile('3mf')}
                                    disabled={!hasValidDimensions}
                                    className={`w-2/3 text-white font-bold py-2 rounded text-xs shadow-sm transition-all hover:-translate-y-0.5 ${!hasValidDimensions ? 'bg-gray-400' : 'bg-emerald-600 hover:bg-emerald-700'}`}
                                >
                                    Exportar .3MF
                                </button>
                                <button 
                                    onClick={() => exportFile('stl')}
                                    disabled={!hasValidDimensions}
                                    className={`w-1/3 text-white font-bold py-2 rounded text-xs shadow-sm transition-all hover:-translate-y-0.5 ${!hasValidDimensions ? 'bg-gray-400' : 'bg-blue-600 hover:bg-blue-700'}`}
                                >
                                    .STL
                                </button>
                            </div>
                            <p className="text-[9px] text-center mt-2 text-gray-400">Nota: El .3MF preserva colores separados para Bambu AMS.</p>
                        </div>
                    </div>

                    <div 
                        className={`flex-grow relative flex items-center justify-center select-none ${designMode ? 'cursor-crosshair bg-[#d1d5db]' : 'cursor-move bg-[#e5e7eb]'}`} 
                        ref={mountRef}
                        onPointerDown={handlePointerDown}
                        onPointerMove={handlePointerMove}
                        onPointerUp={handlePointerUp}
                        onPointerLeave={handlePointerLeave}
                    >
                        {!hasValidDimensions && <div className="text-gray-400 font-bold uppercase tracking-widest animate-pulse">Cargando visualización...</div>}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
